# Observe-only weather-market strategy

[strategy]
name = "weather_market"
enabled = true

[weather_market]
station_id = "KJFK"
station_name = "John F. Kennedy International Airport"
contract_date = "2026-03-20"
domain = "economics"
latitude = 40.6413
longitude = -73.7781
station_utc_offset_hours = -4

# Settlement normalization
settlement_unit = "fahrenheit"
settlement_rounding = "nearest_integer"

# Observe-only runtime
observe_only = true
tick_interval_ms = 300000
evaluation_cooldown_secs = 300
alert_cooldown_secs = 900
emit_all_bucket_views = true

# Intraday correction / regime / peak handling
observation_window_hours = 18
peak_window_start_hour = 13
peak_window_end_hour = 17
late_peak_hour = 18
regime_neutral_band = 1.0
sigma_floor = 1.2
sigma_spread_multiplier = 0.85
recommendation_min_edge = 0.05
recommendation_min_confidence = 0.55

# Public / low-cost data sources
use_open_meteo = true
open_meteo_weight = 0.55

use_nws_hourly = true
use_nws_observations = true
nws_station_id = "KJFK"
nws_grid_office = "OKX"
nws_grid_x = 33
nws_grid_y = 35
nws_weight = 0.45

# Optional regime prior if you want to pin yesterday's actual max yourself.
# previous_day_max_temp = 69.0

market_slug = "jfk-high-temp-2026-03-20"

[[weather_market.buckets]]
label = "<70F"
token_id = "replace-me-token-id-1"
max_temp = 70.0

[[weather_market.buckets]]
label = "70-72F"
token_id = "replace-me-token-id-2"
min_temp = 70.0
max_temp = 73.0

[[weather_market.buckets]]
label = "73-75F"
token_id = "replace-me-token-id-3"
min_temp = 73.0
max_temp = 76.0

[[weather_market.buckets]]
label = ">=76F"
token_id = "replace-me-token-id-4"
min_temp = 76.0
