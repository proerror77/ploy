# Three-layer scoring strategy — unified config
# Same file drives backtest, dry-run, and live — change [runtime].mode only
#
# Scoring model: direction(50%) + edge(35%) + confirmation bonus(15%)
# Entry when total_score > min_entry_score
# OBI uses 5s EWMA smoothing for 10 Hz LOB data

[runtime]
strategy_variant = "three_layer"
mode = "dryrun"
throttle_hz = 10

[strategy]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT", "BNBUSDT"]

vol_floor = 0.001
min_probability = 0.51
min_z_score = 0.20

min_entry_price = 0.10
max_entry_price = 0.85
no_trade_zone_min = 0.45
no_trade_zone_max = 0.55

min_edge = 0.0316

min_time_remaining_secs = 70
max_time_remaining_secs = 125
cooldown_secs = 119

stake_usd = 15.0
max_positions = 1000
max_daily_trades = 1000
allowed_window_secs = [300, 900]

# Optimized parameters (random sampling 300 trials, train Apr 15-17, val Apr 20-21)
# Train: Sharpe=100.296, 1858 trades, +$54,381.36
# Val:   Sharpe=109.227, 1478 trades, +$50,649.69
three_layer_min_entry_score = 0.25
three_layer_min_direction_prob = 0.6478
three_layer_min_distance_over_sigma = 0.3438
three_layer_min_confirmation_score = 0.2921
three_layer_min_drift_confirmation = 0.000479
three_layer_min_edge = 0.0352
three_layer_min_reward_risk = 0.9276
three_layer_take_profit_ask = 0.8486
three_layer_stop_distance_pct = 0.0113
three_layer_max_pm_lag_secs = 15

[execution]
use_spread = false
spread_pct = 0.02
enable_partial_fills = false
min_fill_pct = 0.5
enable_market_impact = false
impact_coefficient = 0.1
default_depth_shares = 500

[reference_data]
capture_sports_state = false

[backtest_data]
include_reference_prices = false
include_sports_state = false
