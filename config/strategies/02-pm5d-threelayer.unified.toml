# Three-layer directional strategy — unified config
# Same file drives backtest, dry-run, and live — change [runtime].mode only
#
# Three-gate pipeline: direction → confirmation → worth-it
# Gate 1 (Direction): log-normal P(S_T>=S_0) + distance_over_sigma
# Gate 2 (Confirmation): drift + OBI score
# Gate 3 (Worth-it): edge + reward/risk ratio

[runtime]
strategy_variant = "three_layer"
mode = "dryrun"
throttle_hz = 1

[strategy]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT", "BNBUSDT"]

vol_floor = 0.001
min_probability = 0.51
min_z_score = 0.20

min_entry_price = 0.10
max_entry_price = 0.65
no_trade_zone_min = 0.45
no_trade_zone_max = 0.55

min_edge = 0.0367

min_time_remaining_secs = 60
max_time_remaining_secs = 240
cooldown_secs = 30

stake_usd = 15.0
max_positions = 1000
max_daily_trades = 1000
allowed_window_secs = [300, 900]

# Scoring model: direction(50%) + edge(35%) + confirmation bonus(15%)
# Entry when total_score > min_entry_score
three_layer_min_entry_score = 0.25
three_layer_min_direction_prob = 0.52
three_layer_min_distance_over_sigma = 0.15
three_layer_min_confirmation_score = 0.03
three_layer_min_drift_confirmation = 0.0001
three_layer_min_edge = 0.015
three_layer_min_reward_risk = 0.9
three_layer_take_profit_ask = 0.70
three_layer_stop_distance_pct = 0.020
three_layer_max_pm_lag_secs = 15

[execution]
use_spread = false
spread_pct = 0.02
enable_partial_fills = false
min_fill_pct = 0.5
enable_market_impact = false
impact_coefficient = 0.1
default_depth_shares = 500

[reference_data]
capture_sports_state = false

[backtest_data]
include_reference_prices = false
include_sports_state = false
