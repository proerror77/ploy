# Unified pm_5m_directional config for StrategyRuntime
# Same file drives backtest, dry-run, and live — change [runtime].mode only
#
# 5-gate pipeline: price validity → quote availability → price filter → probability → edge
# Params from TPE optimization (2026-04-05, real data): Sharpe 240, 121 trades/day

[runtime]
mode = "backtest"
throttle_hz = 1
# max_updates = 500000

[strategy]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT", "HYPEUSDT", "BNBUSDT"]

vol_floor = 0.001
min_probability = 0.5253
min_z_score = 0.35      # deprecated

min_entry_price = 0.15
max_entry_price = 0.85
no_trade_zone_min = 0.45
no_trade_zone_max = 0.55

min_edge = 0.0367

# Enter 22-297s before expiry; last 22s excluded (price already settled)
min_time_remaining_secs = 22
max_time_remaining_secs = 297
cooldown_secs = 71

stake_usd = 25.0
max_positions = 1000
max_daily_trades = 1000

[execution]
# Execution simulation (backtest + dry-run modes)
# CLOB small orders: no synthetic spread, no market impact
use_spread = false
spread_pct = 0.02
enable_partial_fills = false
min_fill_pct = 0.5
enable_market_impact = false
impact_coefficient = 0.1
default_depth_shares = 500
