# Unified pm_5m_directional config for StrategyRuntime
# Same file drives backtest, dry-run, and live — change [runtime].mode only
#
# 5-gate pipeline: price validity → quote availability → price filter → probability → edge

[runtime]
mode = "backtest"       # "backtest" | "replay" | "dryrun" | "live"
throttle_hz = 1         # 1 eval/sec for backtest
# max_updates = 500000  # uncomment to cap backtest length
# record_market_updates_to = "captures/dryrun.ndjson"    # optional for live/dryrun
# replay_market_updates_from = "captures/dryrun.ndjson"  # required when mode = "replay"

[strategy]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT", "HYPEUSDT", "BNBUSDT"]  # All 7 crypto symbols

# Probability model
vol_floor = 0.001
min_probability = 0.55
min_z_score = 0.35      # deprecated — z-score gate removed

# Price gates
min_entry_price = 0.15
max_entry_price = 0.85
no_trade_zone_min = 0.45
no_trade_zone_max = 0.55

# Edge threshold
min_edge = 0.02

# Timing gates
min_time_remaining_secs = 60
max_time_remaining_secs = 300
cooldown_secs = 15

# Position sizing
stake_usd = 25.0
max_positions = 30
max_daily_trades = 1000

[execution]
# Execution simulation (backtest + dry-run modes)
# CLOB small orders: no synthetic spread, no market impact
use_spread = false
spread_pct = 0.02
enable_partial_fills = false
min_fill_pct = 0.5
enable_market_impact = false
impact_coefficient = 0.1
default_depth_shares = 500
