# Staggered Arbitrage Strategy — 時間差套利
# Live trading configuration with $15/trade target

[strategy]
name = "staggered_arb"

[entry]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
# shares_per_trade is now ignored when fixed_amount_usd is set in [risk]
max_concurrent = 5
direction_threshold = 0.03
max_initial_sum = 1.10
min_profit_target = 0.005
min_ask_price = 0.05
min_entry_sum = 0.70

[timing]
max_wait_secs = 180
max_wait_pct = 0.40
min_time_remaining = 60
cooldown_secs = 5
min_leg2_delay_secs = 3
max_trades_per_event = 2

[risk]
# === FUND MANAGEMENT ===
fixed_amount_usd = 1.0          # Target per-leg notional (min 5 shares may raise actual notional)
min_balance_usd = 5.0           # Keep $5 reserve

# === STAGGERED ARB SPECIFIC ===
max_leg1_loss = 0.0             # Never accept leg1 loss
force_complete_threshold = 1.00 # Apply forced-close only on timeout/time-safety/risk and sum >= threshold

[model]
mu = 0.0
vol_lookback_secs = 300
vol_floor = 0.005

[filter]
allowed_windows = [300, 900]
window_tolerance = 30
