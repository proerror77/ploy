# Staggered Arbitrage Strategy — 時間差套利
# Live trading config — opening-window OBI long-gamma leg1 + opportunistic/protective LEG2

[strategy]
name = "staggered_arb"

[entry]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
shares_per_trade = 20
max_concurrent = 0
direction_threshold = 0.04
premium_sum_threshold = 1.00
premium_sum_direction_slope = 1.25
premium_sum_obi_slope = 0.25
max_initial_sum = 0.0
max_leg1_price = 0.58
merge_target_sum = 0.95
min_profit_target = 0.02
min_ask_price = 0.05
min_entry_sum = 0.30

[timing]
max_wait_secs = 120
max_wait_pct = 0.30
min_time_remaining = 45
cooldown_secs = 5
min_leg2_delay_secs = 3
max_trades_per_event = 0
entry_after_start_min_secs = 30  # observe the first 30s before opening new leg1s
entry_after_start_max_secs = 0   # 0 disables the upper bound; rely on time remaining / final-window guards
no_trade_last_secs = 30          # block new leg1s in the final 30s

[risk]
# === FUND MANAGEMENT ===
# fixed_amount_usd disabled: use fixed shares_per_trade sizing
min_balance_usd = 5.0           # Keep $5 reserve

# === STAGGERED ARB SPECIFIC ===
max_leg1_loss = 0.05            # Protective stop: if Leg1 loses 5c, buy Leg2 to cap the trade
force_complete_threshold = 1.20 # Generic force-close cap for timeout/time-safety/final-window; 0 disables the cap
protective_close_threshold = 1.20 # Stop-loss/theta protective cap; allows bounded-loss Leg2 up to $1.20

[model]
mu = 0.0
vol_lookback_secs = 600
vol_floor = 0.003
min_entry_sigma = 0.003
max_entry_sigma = 0.0
use_greeks = true
max_fair_value_distance = 0.15

[filter]
allowed_windows = [300, 900]
window_tolerance = 30
