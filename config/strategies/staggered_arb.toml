# Staggered Arbitrage Strategy — 時間差套利
# Live trading config — opening-window OBI long-gamma leg1 + opportunistic/protective LEG2

[strategy]
name = "staggered_arb"

[entry]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
shares_per_trade = 20
max_concurrent = 0
direction_threshold = 0.05
premium_sum_threshold = 1.00
premium_sum_direction_slope = 1.25
premium_sum_obi_slope = 0.25
max_initial_sum = 0.0
max_leg1_price = 0.55
merge_target_sum = 0.95
min_profit_target = 0.02
min_ask_price = 0.05
min_entry_sum = 0.30

[timing]
max_wait_secs = 120
max_wait_pct = 0.30
min_time_remaining = 45
cooldown_secs = 5
min_leg2_delay_secs = 3
max_trades_per_event = 0
entry_after_start_min_secs = 30  # observe the first 30s before opening new leg1s
entry_after_start_max_secs = 180 # only trade the early post-open window after the 30s observation delay
no_trade_last_secs = 30          # block new leg1s in the final 30s

[risk]
# === FUND MANAGEMENT ===
# fixed_amount_usd disabled: use fixed shares_per_trade sizing
min_balance_usd = 5.0           # Keep $5 reserve

# === STAGGERED ARB SPECIFIC ===
max_leg1_loss = 0.03            # Trigger protective merge earlier; recent live data showed 5c waits were too loose
force_complete_threshold = 1.08 # Keep timeout/time-safety/final-window closes capped near parity
protective_close_threshold = 1.08 # Bound stop-loss/theta protective merges before they become punitive

[model]
mu = 0.0
vol_lookback_secs = 600
vol_floor = 0.003
min_entry_sigma = 0.003
max_entry_sigma = 0.0
use_greeks = true
max_fair_value_distance = 0.15

[filter]
allowed_windows = [300, 900]
window_tolerance = 30
