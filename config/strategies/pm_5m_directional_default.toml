# Polymarket 5m directional strategy

[strategy]
name = "pm_5m_directional"
enabled = true

[pm_5m_directional]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
tick_interval_ms = 1000

# Entry timing window
min_time_remaining_secs = 15
max_time_remaining_secs = 300
final_no_entry_secs = 10

# Probability model
vol_lookback_secs = 30
vol_floor = 0.0005
p_entry = 0.62
min_edge = 0.03
min_abs_z = 0.35

# Binance confirmation
min_obi = 0.05
min_flow_2s = 0.10
obi_weight = 0.75
flow_weight = 1.10
microgap_weight = 0.40
max_l2_age_secs = 2

# Polymarket execution gate
max_pm_spread = 0.03
min_pm_ask_size = 25
max_entry_price = 0.80

# Mid-band no-trade zone
no_trade_price_min = 0.45
no_trade_price_max = 0.55
no_trade_override_z = 0.90
no_trade_override_flow = 0.45

# Position sizing
shares_per_trade = 25
min_shares = 5
cooldown_secs = 30
max_daily_trades = 0
use_kelly_sizing = true
kelly_fraction_scale = 0.15
kelly_fraction_cap = 0.25

# EWMA volatility (Route A v2)
ewma_lambda = 0.94

# Early exit (Route A v2)
enable_early_exit = true
exit_reversion_pct = 0.003
exit_obi_flip = true
