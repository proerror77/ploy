# Polymarket 5m directional strategy
# Uses momentum adapter with directional_mode = true (Binance as oracle)

[strategy]
name = "pm_5m_directional"
enabled = true
mode = "predictive"

[entry]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]

# Directional mode: log-normal probability model on Binance spot
directional_mode = true
directional_vol_floor = 0.0005

# Probability model thresholds
min_edge = 3.0           # min_edge 3% (adapter divides by 100)
max_entry = 80.0         # max_entry_price 0.80 (adapter divides by 100)
min_move = 0.05          # min CEX move % to trigger

# Binance L2 confirmation
min_obi_confirmation = 5.0  # OBI threshold % (adapter divides by 100)

# Position sizing
shares_per_trade = 25.0
max_positions = 5.0

# Mid-band no-trade zone (not parsed by adapter yet — kept as comments)
# no_trade_price_min = 0.45
# no_trade_price_max = 0.55

[timing]
min_time_remaining = 15.0    # seconds
max_time_remaining = 300.0   # seconds
cooldown_secs = 30.0

[risk]
shares = 25.0
max_positions = 5.0
max_daily_trades = 0.0       # 0 = unlimited
use_kelly_sizing = true
kelly_fraction_cap = 0.25

[exit]
exit_edge_floor_pct = 20.0
exit_price_band_pct = 12.0
