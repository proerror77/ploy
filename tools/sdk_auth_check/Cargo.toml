[package]
name = "sdk_auth_check"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
alloy = { version = "1", default-features = false, features = ["signers", "signer-local"] }
polymarket-client-sdk = { version = "0.4", features = ["clob"] }
