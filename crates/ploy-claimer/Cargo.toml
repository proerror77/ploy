[package]
name = "ploy-claimer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Auto-claimer for resolved Polymarket positions"

[features]
default = []
# Enable the Polymarket Builder relayer SDK path for gasless redeem
builder_relayer_sdk = ["dep:builder-relayer-client-rust", "dep:builder_signing_sdk_rs"]

[dependencies]
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true

alloy = { version = "1", default-features = false, features = [
    "signer-local",
    "provider-http",
    "contract",
    "sol-types",
    "rpc-types",
    "reqwest",
    "signers",
    "network",
] }
ethers-core = { version = "2", default-features = false }
ethers-signers = { version = "2", default-features = false }
hex = "0.4"

polymarket-client-sdk = { path = "../../vendor/polymarket-client-sdk", features = ["clob", "ctf", "data"] }

base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac.workspace = true
sha2.workspace = true
rust_decimal_macros.workspace = true

serde_json.workspace = true

builder-relayer-client-rust = { version = "=0.2.2", optional = true }
builder_signing_sdk_rs = { version = "0.1.0", optional = true }

[dev-dependencies]
rust_decimal_macros.workspace = true
