rust_decimal_macros.workspace = true
secrecy.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
chrono.workspace = true
rust_decimal_macros.workspace = true
