[workspace]
members = [
    ".",
    "apps/ployctl",
    "apps/ployd",
    "apps/ploytui",
    "crates/ploy-connectivity",
    "crates/ploy-deployments",
    "crates/ploy-operator-contracts",
    "crates/ploy-platform",
    "crates/ploy-research",
    "crates/ploy-strategy-bundles",
    "crates/ploy-trading",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
license = "MIT"
repository = "https://github.com/proerror77/ploy"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
ploy-connectivity = { path = "crates/ploy-connectivity" }
ploy-deployments = { path = "crates/ploy-deployments" }
ploy-operator-contracts = { path = "crates/ploy-operator-contracts" }
ploy-platform = { path = "crates/ploy-platform" }
ploy-research = { path = "crates/ploy-research" }
ploy-strategy-bundles = { path = "crates/ploy-strategy-bundles" }
ploy-trading = { path = "crates/ploy-trading" }
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
rust_decimal_macros = "1"
secrecy = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[package]
name = "ploy"
version.workspace = true
edition.workspace = true
description = "Compatibility shim for the ploy workspace layout"
authors.workspace = true
license.workspace = true
repository.workspace = true

[dev-dependencies]
ploy-deployments.workspace = true
ploy-operator-contracts.workspace = true
ploy-platform.workspace = true

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
opt-level = 2

[profile.dev]
debug = 1
incremental = true
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = 0
