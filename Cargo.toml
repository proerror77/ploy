[package]
name = "ploy"
version = "0.1.0"
edition = "2021"
description = "Polymarket two-leg arbitrage trading bot"
authors = ["Your Name"]

[workspace]
members = [
    ".",
    "tools/sdk_auth_check",
]
resolver = "2"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "fs", "io-util", "process"] }

# WebSocket
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
futures = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots"], default-features = false }

# Database
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "rust_decimal", "uuid", "macros", "migrate", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
config = { version = "0.14", default-features = false, features = ["toml"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"

# Numeric types
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
rust_decimal_macros = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Async traits
async-trait = "0.1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Crypto for signing (Polymarket requires EIP-712 signatures)
ethers-core = { version = "2", default-features = false, optional = true }
ethers-signers = { version = "2", default-features = false, optional = true }

# Official Polymarket CLOB client SDK
polymarket-client-sdk = { version = "0.4", features = ["gamma", "data", "bridge", "clob", "ctf"] }
builder-relayer-client-rust = { version = "=0.2.2", optional = true }
builder_signing_sdk_rs = { version = "0.1.0", optional = true }

# Agent framework (Claude Code CLI) with MCP tools
claude-agent-sdk-rs = { version = "0.6.3", optional = true }

# Alloy for signing (used by polymarket-client-sdk)
alloy = { version = "1", default-features = false, features = ["signer-local", "provider-http", "contract", "sol-types", "rpc-types", "reqwest"] }

# HMAC authentication
hmac = "0.12"
sha2 = "0.10"

# Encoding
hex = "0.4"
base64 = "0.22"

# Random number generation
rand = "0.8"

# Ordered floats for BTreeMap keys
ordered-float = "4"

# URL parsing
url = "2"
urlencoding = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
dashmap = "6.1.0"
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
tabled = "0.18"
rpassword = "7"
rustyline = "14"
dirs = "6"

# Unix process management (for strategy daemon control)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal", "process"] }

# Terminal UI
crossterm = "0.28"
ratatui = "0.29"

# Health check server and API
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower-http = { version = "0.6", features = ["cors"], optional = true }

# Reinforcement Learning (optional)
# Using ndarray backend for CPU-based RL training
burn = { version = "0.14", default-features = false, features = ["train", "autodiff", "std", "ndarray"], optional = true }
burn-ndarray = { version = "0.14", optional = true }
# Pin bincode to version compatible with burn (rc.3 has decode_borrowed_from_slice)
bincode = { version = "=2.0.0-rc.3", optional = true }

# DuckDB for offline Parquet analysis (optional)
duckdb = { version = "1.4", features = ["bundled"], optional = true }

# ONNX inference (optional; prefer pure-Rust `tract` for deploy simplicity)
tract-onnx = { version = "0.22.0", optional = true }

[features]
default = []
api = ["dep:tower-http"]  # Enable API module with SQLx compile-time checks (requires DATABASE_URL)
api_ws = ["api", "axum/ws"]
claimer = ["claimer_cli", "claimer_daemon"]
claimer_cli = ["claimer_daemon"]
claimer_daemon = ["dep:ethers-core", "dep:ethers-signers"]
analysis_tools = ["analysis_core"]
analysis_core = []
rl = ["burn", "burn-ndarray", "bincode"]
analysis = ["analysis_parquet"]
analysis_parquet = ["duckdb"]
onnx = ["tract-onnx"]
tcn_db = [] # Legacy db-backed TCN path (currently unused)
builder_relayer_sdk = ["dep:builder-relayer-client-rust", "dep:builder_signing_sdk_rs"]
event_edge_claude_sdk = ["dep:claude-agent-sdk-rs"]

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
tower = { version = "0.5", features = ["util"] }

[patch.crates-io]
polymarket-client-sdk = { path = "vendor/polymarket-client-sdk" }

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
opt-level = 2

[profile.dev]
debug = 1
incremental = true
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = 0
