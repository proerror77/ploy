name: Stop Trading Container

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1

jobs:
  stop-container:
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Stop container
      env:
        PRIVATE_KEY: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
        HOST: ${{ secrets.AWS_EC2_HOST }}
        KNOWN_HOSTS: ${{ secrets.AWS_EC2_KNOWN_HOSTS }}
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        : "${KNOWN_HOSTS:?Missing AWS_EC2_KNOWN_HOSTS secret}"
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
        ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null || {
          echo "AWS_EC2_KNOWN_HOSTS is missing an entry for $HOST"
          exit 1
        }

        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem

        ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -i private_key.pem ec2-user@$HOST << 'ENDSSH'
          echo "=== Stopping ploy-trading container ==="
          docker stop ploy-trading
          echo "=== Container stopped ==="
          docker ps -a --filter name=ploy-trading
        ENDSSH

        rm private_key.pem
