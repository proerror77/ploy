name: Release and Deploy Production

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (vX.Y.Z)"
        required: true
      git_ref:
        description: "Git ref to release (branch, tag, or SHA)"
        required: true
        default: "main"
      deploy_production:
        description: "Deploy release to production"
        required: true
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build Release Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      source_sha: ${{ steps.source-sha.outputs.source_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.ref }}

      - name: Capture source commit
        id: source-sha
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ github.event.inputs.release_tag }}"
          fi

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag: $tag"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld
          sudo apt-get install -y sccache || cargo install sccache --locked
          sudo apt-get install -y mold || true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-build

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-release-
            ${{ runner.os }}-sccache-

      - name: Build production binary
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_CACHE_SIZE: 10G
        run: |
          cargo build --release --locked --features rl
          strip target/release/ploy

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Create release bundle
        run: |
          mkdir -p dist
          cp target/release/ploy dist/ploy
          sha256sum dist/ploy > dist/ploy.sha256
          cat > dist/RELEASE.txt <<EOF
          Release: ${{ steps.meta.outputs.release_tag }}
          Commit: ${{ steps.source-sha.outputs.source_sha }}
          Built at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ steps.meta.outputs.release_tag }}
          path: dist/*
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ needs.build.outputs.release_tag }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ needs.build.outputs.source_sha }}
          generate_release_notes: true
          files: |
            dist/ploy
            dist/ploy.sha256
            dist/RELEASE.txt

  deploy-production:
    name: Deploy to Production
    needs: [build, release]
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_production == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ needs.build.outputs.release_tag }}
          path: dist

      - name: Upload binary to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./dist/ploy"
          target: "/tmp/"
          strip_components: 1

      - name: Install release and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            RELEASE_TAG="${{ needs.build.outputs.release_tag }}"
            RELEASE_DIR="/opt/ploy/releases/${RELEASE_TAG}"

            sudo mkdir -p "$RELEASE_DIR"

            if [ -f /opt/ploy/bin/ploy ]; then
              ts="$(date +%Y%m%d_%H%M%S)"
              sudo cp /opt/ploy/bin/ploy "/opt/ploy/bin/ploy.bak.${ts}"
              sudo cp /opt/ploy/bin/ploy /opt/ploy/bin/ploy.bak
            fi

            sudo cp /tmp/ploy "$RELEASE_DIR/ploy"
            sudo cp /tmp/ploy /opt/ploy/bin/ploy
            sudo chmod +x "$RELEASE_DIR/ploy" /opt/ploy/bin/ploy
            sudo chown ploy:ploy "$RELEASE_DIR/ploy" /opt/ploy/bin/ploy
            echo "$RELEASE_TAG" | sudo tee /opt/ploy/bin/.current_release > /dev/null
            rm -f /tmp/ploy

            sudo systemctl restart ploy
            sleep 5
            sudo systemctl is-active --quiet ploy
            curl -fsS http://localhost:8080/health > /dev/null || true

      - name: Deployment summary
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Release: ${{ needs.build.outputs.release_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ needs.build.outputs.source_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
