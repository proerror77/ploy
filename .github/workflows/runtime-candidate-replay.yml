name: Runtime Candidate Replay

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "Deployment id used for replay evidence rows"
        required: true
        default: "pm5d.threelayer.settlement-probability-btc-eth.dryrun"
      config_path:
        description: "Remote strategy config path on tango-1-1"
        required: true
        default: "/opt/ploy/config/strategies/02-pm5d-threelayer.settlement-probability-btc-eth-dryrun.toml"
      recording_path:
        description: "Remote MarketUpdate NDJSON recording path on tango-1-1"
        required: true
        default: "/opt/ploy/data/recordings/pm5d-threelayer-settlement-probability-btc-eth.ndjson"
      runtime_score:
        description: "Exact runtime score expected by promotion evaluator"
        required: true
        default: "autofactor_formula:auto_settlement_full_depth_settlement_edge_x_near_strike"
      strategy_profile:
        description: "Expected strategy profile"
        required: true
        default: "settlement_probability"
      min_trade_count:
        description: "Minimum filled entry trades required"
        required: false
        default: "50"
      min_fill_rate:
        description: "Minimum entry fill rate required"
        required: false
        default: "0.30"
      full_depth_entry:
        description: "Confirm this replay config uses full-depth executable entry accounting"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      options_json:
        description: "Advanced options JSON: min ROI, source walk-forward run, and promotion-feedback dispatch"
        required: false
        default: "{}"
      skip_settlement_exits:
        description: "Skip settlement exits while replaying; false is required for settlement PnL evidence"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
concurrency:
  group: runtime-candidate-replay-${{ github.event.inputs.deployment_id }}-${{ github.event.inputs.runtime_score }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

env:
  CARGO_TERM_COLOR: always
  PLATFORM_TARGET: x86_64-unknown-linux-gnu
  DEPLOY_HOST: ${{ secrets.TANGO_1_1_HOST }}
  REPLAY_EVIDENCE_ISSUE: "538"

jobs:
  runtime-candidate-replay:
    name: Build runtime candidate replay artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tango-1-1-build-only

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Parse replay options
        env:
          OPTIONS_JSON: ${{ github.event.inputs.options_json }}
          INPUT_STRATEGY_PROFILE: ${{ github.event.inputs.strategy_profile }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/runtime-replay
          python3 - <<'PY'
          import json
          import os

          raw = os.environ.get("OPTIONS_JSON") or "{}"
          try:
              options = json.loads(raw)
          except json.JSONDecodeError as error:
              raise SystemExit(f"options_json is not valid JSON: {error}") from error
          if not isinstance(options, dict):
              raise SystemExit("options_json must decode to an object")

          defaults = {
              "min_roi": "0",
              "source_factor_walk_forward_run_id": "",
              "source_factor_walk_forward_artifact_name": "",
              "source_git_ref": "main",
              "auto_dispatch_promotion_evaluation": "false",
              "promotion_required_strategy_profile": "",
              "promotion_allowed_target": "full_depth_settlement_executable_pnl",
          }
          unknown = sorted(set(options) - set(defaults))
          if unknown:
              raise SystemExit(f"unknown options_json keys: {', '.join(unknown)}")
          bool_keys = {"auto_dispatch_promotion_evaluation"}

          def option_text(key: str, default: str = "") -> str:
              value = options.get(key, default)
              if isinstance(value, bool):
                  return "true" if value else "false"
              if value is None:
                  return ""
              if isinstance(value, (int, float)):
                  return str(value)
              if not isinstance(value, str):
                  raise SystemExit(f"options_json.{key} must be a string, number, boolean, or null")
              return value

          values = {key: option_text(key, default) for key, default in defaults.items()}
          for key in bool_keys:
              if values[key].lower() not in {"true", "false"}:
                  raise SystemExit(f"options_json.{key} must be boolean")
              values[key] = values[key].lower()

          source_run_id = values["source_factor_walk_forward_run_id"]
          if ":" in source_run_id and not values["source_factor_walk_forward_artifact_name"]:
              run_id, artifact_name = source_run_id.split(":", 1)
              if not run_id or not artifact_name:
                  raise SystemExit(
                      "source_factor_walk_forward_run_id must be <run-id>:<artifact-name>"
                  )
              values["source_factor_walk_forward_run_id"] = run_id
              values["source_factor_walk_forward_artifact_name"] = artifact_name

          if not values["promotion_required_strategy_profile"]:
              values["promotion_required_strategy_profile"] = os.environ.get(
                  "INPUT_STRATEGY_PROFILE", "settlement_probability"
              )

          env = {
              "REPLAY_MIN_ROI": values["min_roi"],
              "SOURCE_FACTOR_WALK_FORWARD_RUN_ID": values["source_factor_walk_forward_run_id"],
              "SOURCE_FACTOR_WALK_FORWARD_ARTIFACT_NAME": values["source_factor_walk_forward_artifact_name"],
              "SOURCE_GIT_REF": values["source_git_ref"] or "main",
              "AUTO_DISPATCH_PROMOTION_EVALUATION": values["auto_dispatch_promotion_evaluation"],
              "PROMOTION_REQUIRED_STRATEGY_PROFILE": values["promotion_required_strategy_profile"],
              "PROMOTION_ALLOWED_TARGET": values["promotion_allowed_target"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in env.items():
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"options_json.{key} must be single-line")
                  handle.write(f"{key}={value}\n")
          PY

      - name: Build replay runner from workflow ref
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --target "${PLATFORM_TARGET}" \
            --features new-ploy-runner/full \
            -p new-ploy-runner
          strip "target/${PLATFORM_TARGET}/release/new-ploy-runner" || true

      - name: Configure SSH
        env:
          TANGO_1_1_SSH_KEY: ${{ secrets.TANGO_1_1_SSH_KEY }}
          TANGO_SSH_KEY: ${{ secrets.TANGO_SSH_KEY }}
          ALIYUN_ECS_SSH_KEY: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
          TANGO_1_1_KNOWN_HOSTS: ${{ secrets.TANGO_1_1_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}"
          install -m 700 -d ~/.ssh
          if [ -z "${TANGO_1_1_KNOWN_HOSTS}" ]; then
            echo "TANGO_1_1_KNOWN_HOSTS secret is required for pinned SSH host verification" >&2
            exit 1
          fi
          key_source=""
          selected_key=""
          if [ -n "${TANGO_1_1_SSH_KEY}" ]; then
            selected_key="${TANGO_1_1_SSH_KEY}"
            key_source="TANGO_1_1_SSH_KEY"
          elif [ -n "${TANGO_SSH_KEY}" ]; then
            selected_key="${TANGO_SSH_KEY}"
            key_source="TANGO_SSH_KEY"
          elif [ -n "${ALIYUN_ECS_SSH_KEY}" ]; then
            selected_key="${ALIYUN_ECS_SSH_KEY}"
            key_source="ALIYUN_ECS_SSH_KEY"
          else
            echo "No SSH key secret found for tango-1-1 in this workflow context." >&2
            exit 1
          fi
          printf '%s\n' "${TANGO_1_1_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "${selected_key}" > ~/.ssh/tango_1_1_key
          chmod 600 ~/.ssh/tango_1_1_key
          echo "tango-1-1-key-source=${key_source}"
          ssh-keygen -y -f ~/.ssh/tango_1_1_key >/dev/null
          cat > ~/.ssh/config <<EOF
          Host tango-1-1
            HostName ${DEPLOY_HOST}
            User root
            IdentityFile ~/.ssh/tango_1_1_key
            HostKeyAlias tango-1-1
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 20
            ConnectTimeout 30
          EOF

      - name: Run runtime replay on tango-1-1
        env:
          DEPLOYMENT_ID: ${{ github.event.inputs.deployment_id }}
          CONFIG_PATH: ${{ github.event.inputs.config_path }}
          RECORDING_PATH: ${{ github.event.inputs.recording_path }}
          RUNTIME_SCORE: ${{ github.event.inputs.runtime_score }}
          SKIP_SETTLEMENT_EXITS: ${{ github.event.inputs.skip_settlement_exits }}
          REMOTE_DIR: /opt/ploy/tmp/runtime-candidate-replay-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/runtime-replay

          ssh tango-1-1 /bin/bash -s -- "${REMOTE_DIR}" <<'EOF'
          set -euo pipefail
          mkdir -p "$1"
          EOF
          scp "target/${PLATFORM_TARGET}/release/new-ploy-runner" \
            tango-1-1:"${REMOTE_DIR}/ploy-runner"
          scp scripts/enrich_recording_official_settlement.py \
            tango-1-1:"${REMOTE_DIR}/enrich_recording_official_settlement.py"
          scp scripts/enrich_replay_runtime_evidence.py \
            tango-1-1:"${REMOTE_DIR}/enrich_replay_runtime_evidence.py"
          scp scripts/extract_official_settlement_evidence.py \
            tango-1-1:"${REMOTE_DIR}/extract_official_settlement_evidence.py"

          # shellcheck disable=SC2029
          ssh tango-1-1 /bin/bash -s -- \
            "${DEPLOYMENT_ID}" \
            "${CONFIG_PATH}" \
            "${RECORDING_PATH}" \
            "${REMOTE_DIR}" \
            "${RUNTIME_SCORE}" \
            "${SKIP_SETTLEMENT_EXITS}" <<'EOF'
          set -euo pipefail
          deployment_id="$1"
          config_path="$2"
          recording_path="$3"
          remote_dir="$4"
          runtime_score="$5"
          skip_settlement_exits="$6"
          case "${skip_settlement_exits}" in
            true|false) ;;
            *) echo "skip_settlement_exits must be true or false" >&2; exit 1 ;;
          esac

          mkdir -p "${remote_dir}"
          chmod +x "${remote_dir}/ploy-runner"
          test -x "${remote_dir}/ploy-runner"
          test -r "${config_path}"
          test -r "${recording_path}"

          set -a
          . /opt/ploy/.env
          set +a
          if [ -n "${PLOY_DATABASE__URL:-}" ]; then
            PSQL=(psql "${PLOY_DATABASE__URL}" -v ON_ERROR_STOP=1 -t -A)
          else
            PSQL=(env PGPASSWORD=postgres psql -U postgres -d ploy -v ON_ERROR_STOP=1 -t -A)
          fi

          official_token_ids_json="${remote_dir}/official-settlement-token-ids.json"
          official_token_ids_tsv="${remote_dir}/official-settlement-token-ids.tsv"
          official_db_rows_json="${remote_dir}/official-settlement-db-rows.json"
          settlements_json="${remote_dir}/official-settlements.json"
          official_settlement_report="${remote_dir}/official-settlement-report.json"
          enriched_recording="${remote_dir}/recording-official-settlement.ndjson"

          python3 "${remote_dir}/extract_official_settlement_evidence.py" \
            --recording "${recording_path}" \
            --output-token-ids "${official_token_ids_json}"
          python3 - "${official_token_ids_json}" "${official_token_ids_tsv}" <<'PY'
          import json
          import sys

          src, dst = sys.argv[1:]
          token_ids = json.load(open(src, encoding="utf-8"))
          with open(dst, "w", encoding="utf-8") as handle:
              for token_id in token_ids:
                  handle.write(str(token_id).replace("\t", "").replace("\n", ""))
                  handle.write("\n")
          PY

          "${PSQL[@]}" <<SQL
          CREATE TEMP TABLE replay_token_ids(token_id TEXT);
          \\copy replay_token_ids(token_id) FROM '${official_token_ids_tsv}'
          \\o ${official_db_rows_json}
          SELECT COALESCE(
            jsonb_agg(
              jsonb_build_object(
                'token_id', s.token_id,
                'market_slug', s.market_slug,
                'outcome', s.outcome,
                'settlement', s.settled_price::text,
                'resolved', s.resolved,
                'resolved_at', s.resolved_at
              )
              ORDER BY s.token_id
            ),
            '[]'::jsonb
          )::text
          FROM pm_token_settlements s
          JOIN replay_token_ids t ON t.token_id = s.token_id
          WHERE s.resolved = true
            AND s.settled_price IS NOT NULL;
          \\o
          SQL

          python3 "${remote_dir}/extract_official_settlement_evidence.py" \
            --recording "${recording_path}" \
            --db-settlements-json "${official_db_rows_json}" \
            --output-json "${settlements_json}" \
            --report-json "${official_settlement_report}"

          python3 "${remote_dir}/enrich_recording_official_settlement.py" \
            --input "${recording_path}" \
            --output "${enriched_recording}" \
            --settlements-json "${settlements_json}" \
            --report-json "${remote_dir}/recording-enrichment.json"
          test -s "${enriched_recording}"

          replay_config="${remote_dir}/replay.toml"
          python3 - "${config_path}" "${enriched_recording}" "${replay_config}" "${runtime_score}" "${skip_settlement_exits}" <<'PY'
          import json
          import sys

          src, recording, dst, runtime_score, skip_settlement_exits = sys.argv[1:]
          if not runtime_score:
              raise SystemExit("runtime_score is required")
          if "\n" in runtime_score or "\r" in runtime_score:
              raise SystemExit("runtime_score must be single-line")
          lines = []
          inserted_replay_path = False
          wrote_runtime_score = False
          source_lines = open(src, encoding="utf-8").read().splitlines()
          has_runtime_score = any(
              line.strip().startswith("three_layer_autofactor_runtime_score")
              for line in source_lines
          )
          runtime_score_line = (
              "three_layer_autofactor_runtime_score = "
              f"{json.dumps(runtime_score, ensure_ascii=True)}"
          )
          for raw in source_lines:
              stripped = raw.strip()
              if stripped.startswith("mode = "):
                  lines.append('mode = "replay"')
                  lines.append(f"skip_settlement_exits = {skip_settlement_exits}")
                  lines.append(f'replay_market_updates_from = "{recording}"')
                  inserted_replay_path = True
                  continue
              if stripped.startswith("skip_settlement_exits"):
                  continue
              if stripped.startswith("record_market_updates_to"):
                  continue
              if stripped.startswith("record_market_updates_max_"):
                  continue
              if stripped.startswith("three_layer_autofactor_runtime_score"):
                  lines.append(runtime_score_line)
                  wrote_runtime_score = True
                  continue
              lines.append(raw)
              if stripped.startswith("strategy_profile") and not has_runtime_score:
                  lines.append(runtime_score_line)
                  wrote_runtime_score = True
          if not inserted_replay_path:
              raise SystemExit("runtime mode line not found in source config")
          if not wrote_runtime_score:
              raise SystemExit("strategy_profile/runtime score location not found in source config")
          with open(dst, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

          timeout 600 "${remote_dir}/ploy-runner" run \
            --config "${replay_config}" \
            --deployment-id "${deployment_id}" \
            --output-json "${remote_dir}/runtime-evaluation.json"

          python3 "${remote_dir}/enrich_replay_runtime_evidence.py" \
            --input-json "${remote_dir}/runtime-evaluation.json" \
            --output-json "${remote_dir}/runtime-evaluation.json" \
            --settlements-json "${settlements_json}" \
            --report-json "${remote_dir}/runtime-evidence-enrichment.json"

          ls -lh "${remote_dir}/runtime-evaluation.json" "${official_settlement_report}" "${remote_dir}/recording-enrichment.json" "${remote_dir}/runtime-evidence-enrichment.json"
          EOF

          scp tango-1-1:"${REMOTE_DIR}/runtime-evaluation.json" artifacts/runtime-replay/runtime-evaluation.json
          scp tango-1-1:"${REMOTE_DIR}/official-settlement-report.json" artifacts/runtime-replay/official-settlement-report.json
          scp tango-1-1:"${REMOTE_DIR}/recording-enrichment.json" artifacts/runtime-replay/recording-enrichment.json
          scp tango-1-1:"${REMOTE_DIR}/runtime-evidence-enrichment.json" artifacts/runtime-replay/runtime-evidence-enrichment.json

      - name: Build candidate strategy replay artifact
        env:
          RUNTIME_SCORE: ${{ github.event.inputs.runtime_score }}
          STRATEGY_PROFILE: ${{ github.event.inputs.strategy_profile }}
          MIN_TRADE_COUNT: ${{ github.event.inputs.min_trade_count }}
          MIN_FILL_RATE: ${{ github.event.inputs.min_fill_rate }}
          FULL_DEPTH_ENTRY: ${{ github.event.inputs.full_depth_entry }}
        run: |
          set -euo pipefail
          args=(
            --runtime-evaluation-json artifacts/runtime-replay/runtime-evaluation.json
            --runtime-score "${RUNTIME_SCORE}"
            --strategy-profile "${STRATEGY_PROFILE}"
            --min-trade-count "${MIN_TRADE_COUNT}"
            --min-fill-rate "${MIN_FILL_RATE}"
            --min-roi "${REPLAY_MIN_ROI}"
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            --output-json artifacts/runtime-replay/candidate-strategy-replay.json
            --output-md artifacts/runtime-replay/candidate-strategy-replay.md
          )
          if [ "${FULL_DEPTH_ENTRY}" = "true" ]; then
            args+=(--full-depth-entry)
          fi
          python3 scripts/build_runtime_candidate_strategy_replay.py "${args[@]}"

      - name: Write AutoFactor promotion follow-up
        env:
          RUNTIME_SCORE: ${{ github.event.inputs.runtime_score }}
          STRATEGY_PROFILE: ${{ github.event.inputs.strategy_profile }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path

          run_id = os.environ["GITHUB_RUN_ID"]
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"
          )
          artifact_name = f"runtime-candidate-replay-{run_id}"
          options = {
              "candidate_strategy_replay_run_id": run_id,
              "candidate_strategy_replay_artifact_name": artifact_name,
              "create_handoff_issue": False,
              "create_config_pr": False,
              "fail_if_blocked": False,
          }
          source_run_id = os.environ.get("SOURCE_FACTOR_WALK_FORWARD_RUN_ID", "").strip()
          source_artifact = os.environ.get("SOURCE_FACTOR_WALK_FORWARD_ARTIFACT_NAME", "").strip()
          source_git_ref = os.environ.get("SOURCE_GIT_REF", "main").strip() or "main"
          should_dispatch = (
              os.environ.get("AUTO_DISPATCH_PROMOTION_EVALUATION", "false") == "true"
              and bool(source_run_id)
          )
          payload = {
              "kind": "autofactor_promotion_followup",
              "runtime_candidate_replay_run_id": run_id,
              "runtime_candidate_replay_artifact_name": artifact_name,
              "runtime_candidate_replay_url": run_url,
              "runtime_score": os.environ["RUNTIME_SCORE"],
              "strategy_profile": os.environ["STRATEGY_PROFILE"],
              "source_factor_walk_forward_run_id": source_run_id,
              "source_factor_walk_forward_artifact_name": source_artifact,
              "source_git_ref": source_git_ref,
              "promotion_options_json": options,
              "promotion_workflow": "autofactor-strategy-promotion.yml",
              "requires_factor_walk_forward_run_id": not bool(source_run_id),
              "auto_dispatch_promotion_evaluation": should_dispatch,
          }
          dispatch = {
              "kind": "autofactor_promotion_dispatch",
              "should_dispatch": should_dispatch,
              "blocked_reason": "" if should_dispatch else "missing_source_factor_walk_forward_run_id",
              "workflow": "autofactor-strategy-promotion.yml",
              "git_ref": source_git_ref,
              "factor_walk_forward_run_id": source_run_id,
              "artifact_name": source_artifact,
              "required_strategy_profile": os.environ.get(
                  "PROMOTION_REQUIRED_STRATEGY_PROFILE", os.environ["STRATEGY_PROFILE"]
              ),
              "allowed_target": os.environ.get(
                  "PROMOTION_ALLOWED_TARGET", "full_depth_settlement_executable_pnl"
              ),
              "options_json": options,
          }
          out_dir = Path("artifacts/runtime-replay")
          out_dir.mkdir(parents=True, exist_ok=True)
          (out_dir / "autofactor-promotion-options.json").write_text(
              json.dumps(options, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (out_dir / "autofactor-promotion-followup.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (out_dir / "autofactor-promotion-dispatch.json").write_text(
              json.dumps(dispatch, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          factor_run_arg = source_run_id or "<factor-walk-forward-run-id>"
          artifact_arg = f" -f artifact_name={shlex.quote(source_artifact)}" if source_artifact else ""
          command = (
              "gh workflow run autofactor-strategy-promotion.yml "
              f"-f git_ref={shlex.quote(source_git_ref)} "
              f"-f factor_walk_forward_run_id={shlex.quote(factor_run_arg)}"
              f"{artifact_arg} "
              f"-f required_strategy_profile={shlex.quote(dispatch['required_strategy_profile'])} "
              f"-f allowed_target={shlex.quote(dispatch['allowed_target'])} "
              f"-f options_json={shlex.quote(json.dumps(options, separators=(',', ':')))}"
          )
          (out_dir / "autofactor-promotion-followup.md").write_text(
              "\n".join(
                  [
                      "# AutoFactor Promotion Follow-Up",
                      "",
                      f"- Runtime replay run: `{run_id}`",
                      f"- Runtime replay artifact: `{artifact_name}`",
                      f"- Runtime score: `{os.environ['RUNTIME_SCORE']}`",
                      f"- Strategy profile: `{os.environ['STRATEGY_PROFILE']}`",
                      f"- Source factor walk-forward run: `{source_run_id or 'required'}`",
                      f"- Auto promotion evaluation dispatch: `{str(should_dispatch).lower()}`",
                      "",
                      "Use this replay artifact as the direct candidate strategy replay input for the source factor walk-forward run:",
                      "",
                      "```bash",
                      command,
                      "```",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Runtime Candidate Replay"
            echo ""
            echo "- Deployment: \`${{ github.event.inputs.deployment_id }}\`"
            echo "- Config: \`${{ github.event.inputs.config_path }}\`"
            echo "- Recording: \`${{ github.event.inputs.recording_path }}\`"
            echo "- Runtime score: \`${{ github.event.inputs.runtime_score }}\`"
            echo "- Artifact: \`runtime-candidate-replay-${{ github.run_id }}\`"
            echo "- Promotion options artifact: \`autofactor-promotion-options.json\`"
            if [ -f artifacts/runtime-replay/candidate-strategy-replay.json ]; then
              echo ""
              echo '```json'
              python3 -c 'import json; data=json.load(open("artifacts/runtime-replay/candidate-strategy-replay.json")); print(json.dumps({"promotion_ready": data.get("promotion_ready"), "basis": data.get("basis"), "metrics": data.get("metrics"), "score_counterfactual": data.get("score_counterfactual"), "blocking_risk_flags": data.get("blocking_risk_flags")}, indent=2, sort_keys=True))'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime replay artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-candidate-replay-${{ github.run_id }}
          path: artifacts/runtime-replay/
          if-no-files-found: ignore
          retention-days: 14

      - name: Dispatch AutoFactor promotion evaluation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatch_path="artifacts/runtime-replay/autofactor-promotion-dispatch.json"
          if [ ! -f "${dispatch_path}" ]; then
            echo "Missing promotion dispatch metadata; skipping evaluator dispatch."
            exit 0
          fi
          python3 - <<'PY' > artifacts/runtime-replay/autofactor-promotion-dispatch.env
          import json
          from pathlib import Path

          dispatch = json.loads(Path("artifacts/runtime-replay/autofactor-promotion-dispatch.json").read_text(encoding="utf-8"))
          env = {
              "PROMOTION_SHOULD_DISPATCH": "true" if dispatch.get("should_dispatch") is True else "false",
              "PROMOTION_GIT_REF": str(dispatch.get("git_ref") or "main"),
              "PROMOTION_FACTOR_WALK_FORWARD_RUN_ID": str(dispatch.get("factor_walk_forward_run_id") or ""),
              "PROMOTION_ARTIFACT_NAME": str(dispatch.get("artifact_name") or ""),
              "PROMOTION_REQUIRED_STRATEGY_PROFILE": str(dispatch.get("required_strategy_profile") or "settlement_probability"),
              "PROMOTION_ALLOWED_TARGET": str(dispatch.get("allowed_target") or "full_depth_settlement_executable_pnl"),
              "PROMOTION_OPTIONS_JSON": json.dumps(dispatch.get("options_json") or {}, separators=(",", ":")),
          }
          for key, value in env.items():
              if "\n" in value or "\r" in value:
                  raise SystemExit(f"{key} must be single-line")
              print(f"{key}={value}")
          PY
          # shellcheck disable=SC1091
          . artifacts/runtime-replay/autofactor-promotion-dispatch.env
          if [ "${PROMOTION_SHOULD_DISPATCH}" != "true" ]; then
            echo "Promotion evaluator auto-dispatch disabled or missing source walk-forward run."
            exit 0
          fi
          args=(
            workflow run autofactor-strategy-promotion.yml
            --ref "${PROMOTION_GIT_REF}"
            -f "git_ref=${PROMOTION_GIT_REF}"
            -f "factor_walk_forward_run_id=${PROMOTION_FACTOR_WALK_FORWARD_RUN_ID}"
            -f "required_strategy_profile=${PROMOTION_REQUIRED_STRATEGY_PROFILE}"
            -f "allowed_target=${PROMOTION_ALLOWED_TARGET}"
            -f "options_json=${PROMOTION_OPTIONS_JSON}"
          )
          if [ -n "${PROMOTION_ARTIFACT_NAME}" ]; then
            args+=(-f "artifact_name=${PROMOTION_ARTIFACT_NAME}")
          fi
          gh "${args[@]}"
          echo "Dispatched AutoFactor promotion evaluator for factor walk-forward run ${PROMOTION_FACTOR_WALK_FORWARD_RUN_ID}."

      - name: Comment replay evidence on issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const issue_number = Number(process.env.REPLAY_EVIDENCE_ISSUE);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            let ready = false;
            let metrics = {};
            let scoreCounterfactual = {};
            let blockers = ["missing_candidate_strategy_replay_artifact"];
            if (fs.existsSync("artifacts/runtime-replay/candidate-strategy-replay.json")) {
              const data = JSON.parse(fs.readFileSync("artifacts/runtime-replay/candidate-strategy-replay.json", "utf8"));
              ready = Boolean(data.promotion_ready);
              metrics = data.metrics || {};
              scoreCounterfactual = data.score_counterfactual || {};
              blockers = data.blocking_risk_flags || [];
            }
            const body = [
              "Runtime candidate replay evidence:",
              "",
              `- Workflow: ${context.workflow}`,
              `- Run URL: ${runUrl}`,
              `- Deployment: \`${{ github.event.inputs.deployment_id }}\``,
              `- Config: \`${{ github.event.inputs.config_path }}\``,
              `- Recording: \`${{ github.event.inputs.recording_path }}\``,
              `- Runtime score: \`${{ github.event.inputs.runtime_score }}\``,
              `- Artifact: \`runtime-candidate-replay-${process.env.GITHUB_RUN_ID}\``,
              `- Promotion ready: \`${ready}\``,
              `- Trade count: \`${metrics.trade_count ?? "n/a"}\``,
              `- Unique events: \`${metrics.unique_event_count ?? "n/a"}\``,
              `- Entry fill rate: \`${metrics.entry_fill_rate ?? "n/a"}\``,
              `- ROI: \`${metrics.roi ?? "n/a"}\``,
              `- Score counterfactual: \`${scoreCounterfactual.diagnosis ?? "n/a"}\``,
              `- Blocking flags: \`${blockers.join(", ") || "none"}\``
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
