name: Healthcheck tango-1-1

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.TANGO_1_1_HOST }}

jobs:
  healthcheck:
    name: Verify tango-1-1 runtime health
    runs-on: [self-hosted, tango-1-1]
    timeout-minutes: 10

    steps:
      - name: Ensure SSH client
        run: |
          set -euo pipefail
          if command -v ssh >/dev/null 2>&1; then
            ssh -V
            exit 0
          fi

          if [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y openssh-client
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y openssh-client
          else
            echo "ssh client is missing and passwordless sudo is unavailable on this runner" >&2
            exit 1
          fi

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.TANGO_1_1_SSH_KEY }}' > ~/.ssh/tango_1_1_key
          chmod 600 ~/.ssh/tango_1_1_key
          cat > ~/.ssh/config <<EOF
          Host tango-1-1
            HostName ${DEPLOY_HOST}
            User root
            IdentityFile ~/.ssh/tango_1_1_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 20
            ConnectTimeout 30
          EOF

      - name: Run remote health checks
        run: |
          ssh tango-1-1 /bin/bash <<'EOF'
            set -euo pipefail

            require_postgres() {
              systemctl is-active --quiet postgresql@16-main
              PGPASSWORD=postgres psql -h localhost -U postgres -d ploy -v ON_ERROR_STOP=1 -Atqc "SELECT 1" >/dev/null
            }

            require_service_guardrails() {
              local unit="$1"
              local restart_policy
              local oom_policy
              local memory_high
              local memory_max

              restart_policy=$(systemctl show -P Restart "${unit}")
              oom_policy=$(systemctl show -P OOMPolicy "${unit}")
              memory_high=$(systemctl show -P MemoryHigh "${unit}")
              memory_max=$(systemctl show -P MemoryMax "${unit}")

              test "${restart_policy}" = "always"
              test "${oom_policy}" = "kill"
              test "${memory_high}" != "[not set]"
              test "${memory_max}" != "[not set]"
            }
            service_exists() {
              systemctl list-unit-files "$1" --no-legend 2>/dev/null | grep -q '^'
            }

            require_postgres

            systemctl is-active --quiet ploy-binance-aggtrade-collector.service
            systemctl is-active --quiet ploy-binance-price-collector.service
            systemctl is-active --quiet ploy-binance-lob-collector.service
            systemctl is-active --quiet ploy-deribit-iv-collector.service
            systemctl is-active --quiet ploy-deribit-greeks-collector.service
            systemctl is-active --quiet ployd.service
            systemctl is-active --quiet ploy-quote-collector.service
            if service_exists ploy-pm-trade-collector.service; then
              systemctl is-active --quiet ploy-pm-trade-collector.service
            fi
            require_service_guardrails ploy-binance-lob-collector.service
            require_service_guardrails ploy-deribit-greeks-collector.service
            require_service_guardrails ployd.service
            require_service_guardrails ploy-quote-collector.service
            if service_exists ploy-pm-trade-collector.service; then
              require_service_guardrails ploy-pm-trade-collector.service
            fi

            if journalctl -u ployd.service --since '15 minutes ago' --no-pager \
              | grep -qE "DB connection failed|running without persistence|Signal recorder disabled"; then
              echo "ployd persistence degraded within the last 15 minutes" >&2
              exit 1
            fi

            if [ "$(PGPASSWORD=postgres psql -h localhost -U postgres -d ploy -Atqc \
              "SELECT EXISTS (SELECT 1 FROM binance_lob_ticks WHERE event_time >= NOW() - INTERVAL '15 minutes')")" != "t" ]; then
              echo "binance_lob_ticks has not advanced within the last 15 minutes" >&2
              exit 1
            fi
            if [ "$(PGPASSWORD=postgres psql -h localhost -U postgres -d ploy -Atqc \
              "SELECT EXISTS (SELECT 1 FROM binance_agg_trade_ticks WHERE trade_time >= NOW() - INTERVAL '10 minutes')")" != "t" ]; then
              echo "binance_agg_trade_ticks has not advanced within the last 10 minutes" >&2
              exit 1
            fi
            if [ "$(PGPASSWORD=postgres psql -h localhost -U postgres -d ploy -Atqc \
              "SELECT EXISTS (SELECT 1 FROM binance_price_ticks WHERE trade_time >= NOW() - INTERVAL '10 minutes')")" != "t" ]; then
              echo "binance_price_ticks has not advanced within the last 10 minutes" >&2
              exit 1
            fi
            if [ "$(PGPASSWORD=postgres psql -h localhost -U postgres -d ploy -Atqc \
              "SELECT EXISTS (SELECT 1 FROM deribit_iv_ticks WHERE fetched_at >= NOW() - INTERVAL '15 minutes')")" != "t" ]; then
              echo "deribit_iv_ticks has not advanced within the last 15 minutes" >&2
              exit 1
            fi
            if [ "$(PGPASSWORD=postgres psql -h localhost -U postgres -d ploy -Atqc \
              "SELECT EXISTS (SELECT 1 FROM deribit_atm_greeks_ticks WHERE fetched_at >= NOW() - INTERVAL '15 minutes')")" != "t" ]; then
              echo "deribit_atm_greeks_ticks has not advanced within the last 15 minutes" >&2
              exit 1
            fi
            if journalctl -u ploy-binance-price-collector.service --since '15 minutes ago' --no-pager \
              | grep -qE "uq_binance_price_ticks_symbol_second|duplicate key value"; then
              echo "binance price collector still reports duplicate-write churn" >&2
              exit 1
            fi
            if journalctl \
              -u ploy-binance-price-collector.service \
              -u ploy-binance-aggtrade-collector.service \
              -u ploy-binance-lob-collector.service \
              --since '15 minutes ago' --no-pager \
              | grep -qE "Main process exited, code=exited, status=1/FAILURE|Failed with result 'exit-code'"; then
              echo "one or more Binance collectors entered a restart failure loop" >&2
              exit 1
            fi
            if journalctl -u ploy-quote-collector.service --since '15 minutes ago' --no-pager \
              | grep -qE "quote collector stale|Quote collector failed"; then
              echo "polymarket quote collector reported stale or failed WebSocket state" >&2
              exit 1
            fi
            if journalctl -u ploy-deribit-iv-collector.service --since '15 minutes ago' --no-pager \
              | grep -qE "no partition of relation \"deribit_iv_ticks\""; then
              echo "deribit iv collector still reports missing partitions" >&2
              exit 1
            fi
            if journalctl -u ploy-deribit-greeks-collector.service --since '15 minutes ago' --no-pager \
              | grep -qE "Traceback|psql failed|column \"option_type\" does not exist|column \"strike\" does not exist"; then
              echo "deribit greeks collector failed within the last 15 minutes" >&2
              exit 1
            fi

            latest_signal=$(
              PGPASSWORD=postgres psql -h localhost -U postgres -d ploy -Atqc \
                "SELECT coalesce(max(recorded_at)::text, 'none') FROM signal_history"
            )
            latest_aggtrade=$(
              PGPASSWORD=postgres psql -h localhost -U postgres -d ploy -Atqc \
                "SELECT coalesce(max(trade_time)::text, 'none') FROM binance_agg_trade_ticks"
            )
            latest_price=$(
              PGPASSWORD=postgres psql -h localhost -U postgres -d ploy -Atqc \
                "SELECT coalesce(max(trade_time)::text, 'none') FROM binance_price_ticks"
            )
            latest_lob=$(
              PGPASSWORD=postgres psql -h localhost -U postgres -d ploy -Atqc \
                "SELECT coalesce(max(event_time)::text, 'none') FROM binance_lob_ticks"
            )
            latest_deribit=$(
              PGPASSWORD=postgres psql -h localhost -U postgres -d ploy -Atqc \
                "SELECT coalesce(max(fetched_at)::text, 'none') FROM deribit_iv_ticks"
            )
            latest_deribit_greeks=$(
              PGPASSWORD=postgres psql -h localhost -U postgres -d ploy -Atqc \
                "SELECT coalesce(max(fetched_at)::text, 'none') FROM deribit_atm_greeks_ticks"
            )

            echo "postgres=$(systemctl show -P ActiveState postgresql@16-main)"
            echo "aggtrade=$(systemctl show -P ActiveState ploy-binance-aggtrade-collector.service)"
            echo "price=$(systemctl show -P ActiveState ploy-binance-price-collector.service)"
            echo "lob=$(systemctl show -P ActiveState ploy-binance-lob-collector.service)"
            echo "deribit=$(systemctl show -P ActiveState ploy-deribit-iv-collector.service)"
            echo "deribit_greeks=$(systemctl show -P ActiveState ploy-deribit-greeks-collector.service)"
            echo "ployd=$(systemctl show -P ActiveState ployd.service)"
            echo "collector=$(systemctl show -P ActiveState ploy-quote-collector.service)"
            if service_exists ploy-pm-trade-collector.service; then
              echo "pm_trade_collector=$(systemctl show -P ActiveState ploy-pm-trade-collector.service)"
            fi
            echo "latest_aggtrade=${latest_aggtrade}"
            echo "latest_price=${latest_price}"
            echo "latest_lob=${latest_lob}"
            echo "latest_deribit=${latest_deribit}"
            echo "latest_deribit_greeks=${latest_deribit_greeks}"
            echo "latest_signal=${latest_signal}"
          EOF

      - name: Healthcheck summary
        run: |
          {
            echo "## tango-1-1 healthcheck"
            echo "- PostgreSQL must be active and queryable"
            echo "- ployd, ploy-binance-aggtrade-collector, ploy-binance-price-collector, ploy-binance-lob-collector, ploy-deribit-iv-collector, ploy-quote-collector, and installed pm trade collector services must be active"
            echo "- systemd guardrails must remain configured on all checked services"
            echo "- binance_agg_trade_ticks must advance within the last 10 minutes"
            echo "- binance_price_ticks must advance within the last 10 minutes"
            echo "- binance_lob_ticks must advance within the last 15 minutes"
            echo "- deribit_iv_ticks must advance within the last 15 minutes"
            echo "- deribit_atm_greeks_ticks must advance within the last 15 minutes"
            echo "- ployd must not log degraded persistence messages in the last 15 minutes"
          } >> "$GITHUB_STEP_SUMMARY"
