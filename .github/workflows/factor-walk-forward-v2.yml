name: Factor Walk-Forward V2
# Research issue evidence label: evidence:walk-forward

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref"
        required: true
        default: "main"
      start_date:
        description: "Review start date (YYYY-MM-DD)"
        required: true
        default: "2026-04-21"
      end_date:
        description: "Review end date (YYYY-MM-DD)"
        required: true
        default: "2026-04-25"
      symbols:
        description: "Comma-separated Binance symbols"
        required: true
        default: "BTCUSDT,ETHUSDT,SOLUSDT,DOGEUSDT,BNBUSDT,XRPUSDT"
      stake_usd:
        description: "Fixed notional per candidate"
        required: true
        default: "15"
      snapshot_run_id:
        description: "Optional Research Snapshot workflow run id to consume"
        required: false
        default: ""
      options_json:
        description: "Advanced hosted options JSON: walk windows, factor filters, local snapshot registry, optional replay/candidate artifacts"
        required: false
        default: '{"train_window_days":2,"train_window_hours":"","test_window_days":1,"test_window_hours":"","step_days":1,"step_hours":"","lob_sample_secs":30,"pm_book_sample_secs":30,"observation_sample_secs":30,"max_quote_age_secs":30,"top_n":20,"min_observations":20,"top_quantile":0.2,"factor_name_filter":"","data_quality_mode":"strict_continuous","min_event_complete_events":20,"min_event_complete_rows":40,"issue_number":"","snapshot_registry_dir":"","replay_parity_json":"","replay_parity_run_id":"","replay_parity_artifact_name":"","alpha_search_plan_json":"","alpha_search_plan_run_id":"","alpha_search_plan_artifact_name":"","alpha_search_plan_target":"full_depth_settlement_executable_pnl","alpha_search_llm_prior_json":"","alpha_search_state_json":""}'

concurrency:
  group: factor-walk-forward-v2-${{ github.event.inputs.git_ref }}-${{ github.event.inputs.start_date }}-${{ github.event.inputs.end_date }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  route-hosted-artifact:
    name: Route snapshot-backed walk-forward to GitHub-hosted runner
    if: ${{ github.event.inputs.snapshot_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout orchestration code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Dispatch hosted artifact workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_REF: ${{ github.event.inputs.git_ref }}
          OPTIONS_JSON: ${{ github.event.inputs.options_json }}
        run: |
          set -euo pipefail
          hosted_options="$(python3 - <<'PY'
          import json
          import os

          allowed = {
              "train_window_days",
              "train_window_hours",
              "test_window_days",
              "test_window_hours",
              "step_days",
              "step_hours",
              "lob_sample_secs",
              "pm_book_sample_secs",
              "observation_sample_secs",
              "max_quote_age_secs",
              "top_n",
              "min_observations",
              "top_quantile",
              "factor_name_filter",
              "report_suite",
              "data_quality_mode",
              "min_event_complete_events",
              "min_event_complete_rows",
              "replay_parity_json",
              "replay_parity_run_id",
              "replay_parity_artifact_name",
              "candidate_strategy_replay_json",
              "candidate_strategy_replay_run_id",
              "candidate_strategy_replay_artifact_name",
              "require_deribit",
              "alpha_search_plan_json",
              "alpha_search_plan_run_id",
              "alpha_search_plan_artifact_name",
              "alpha_search_plan_target",
              "alpha_search_llm_prior_json",
              "alpha_search_state_json",
              "required_strategy_profile",
              "allowed_target",
              "issue_number",
              "create_handoff_issue",
              "create_config_pr",
              "strategy_config",
              "fail_if_blocked",
          }
          raw = os.environ.get("OPTIONS_JSON", "").strip()
          data = json.loads(raw) if raw else {}
          if not isinstance(data, dict):
              raise SystemExit("options_json must be a JSON object")
          filtered = {key: value for key, value in data.items() if key in allowed}
          if filtered.get("data_quality_mode") == "strict_continuous":
              filtered["data_quality_mode"] = "strict_continuous"
          print(json.dumps(filtered, separators=(",", ":"), sort_keys=True))
          PY
          )"
          gh workflow run factor-walk-forward-v2-hosted-artifact.yml \
            --ref "${GIT_REF}" \
            -f git_ref="${GIT_REF}" \
            -f snapshot_run_id="${{ github.event.inputs.snapshot_run_id }}" \
            -f start_date="${{ github.event.inputs.start_date }}" \
            -f end_date="${{ github.event.inputs.end_date }}" \
            -f symbols="${{ github.event.inputs.symbols }}" \
            -f stake_usd="${{ github.event.inputs.stake_usd }}" \
            -f options_json="${hosted_options}"

      - name: Write routing summary
        run: |
          {
            echo "## Factor Walk-Forward V2"
            echo ""
            echo "Snapshot-backed requests are routed to \`factor-walk-forward-v2-hosted-artifact.yml\` on \`ubuntu-latest\`."
            echo ""
            echo "- Source snapshot run: \`${{ github.event.inputs.snapshot_run_id }}\`"
            echo "- Active path: hosted snapshot artifact"
          } >> "$GITHUB_STEP_SUMMARY"

  reject-missing-snapshot:
    name: Reject non-snapshot walk-forward
    if: ${{ github.event.inputs.snapshot_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Explain canonical research path
        run: |
          {
            echo "## Factor Walk-Forward V2"
            echo ""
            echo "This workflow is now a snapshot-backed router only."
            echo "Run research-snapshot.yml first, then dispatch this workflow with snapshot_run_id so it routes to factor-walk-forward-v2-hosted-artifact.yml."
            echo "The former ploy-ci-1 direct-DB branch has been removed from the active research chain."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Factor Walk-Forward V2 requires snapshot_run_id; direct DB research is no longer available from this workflow." >&2
          exit 2
