name: Factor Walk-Forward V2

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref"
        required: true
        default: "main"
      start_date:
        description: "Review start date (YYYY-MM-DD)"
        required: true
        default: "2026-04-21"
      end_date:
        description: "Review end date (YYYY-MM-DD)"
        required: true
        default: "2026-04-25"
      symbols:
        description: "Comma-separated Binance symbols"
        required: true
        default: "BTCUSDT,ETHUSDT,SOLUSDT,DOGEUSDT,BNBUSDT,XRPUSDT"
      stake_usd:
        description: "Fixed notional per candidate"
        required: true
        default: "15"
      train_window_days:
        description: "Training window length in days"
        required: false
        default: "2"
      test_window_days:
        description: "Test window length in days"
        required: false
        default: "1"
      step_days:
        description: "Rolling step length in days"
        required: false
        default: "1"
      lob_sample_secs:
        description: "Binance and PM LOB sample interval"
        required: false
        default: "30"
      observation_sample_secs:
        description: "Factor observation output interval"
        required: false
        default: "30"
      max_quote_age_secs:
        description: "Maximum PM quote age"
        required: false
        default: "30"
      top_n:
        description: "Number of factor rows to keep per test window"
        required: false
        default: "20"
      min_observations:
        description: "Minimum observations for a factor"
        required: false
        default: "20"
      top_quantile:
        description: "Train-window selected quantile"
        required: false
        default: "0.2"
      factor_name_filter:
        description: "Optional comma-separated factor-name substrings"
        required: false
        default: ""
      snapshot_run_id:
        description: "Optional Research Snapshot workflow run id to consume"
        required: false
        default: ""
      compile_snapshot:
        description: "Compile a fresh snapshot before walk-forward when snapshot_run_id is empty"
        required: false
        default: "true"
      allow_direct_db_debug:
        description: "Allow non-canonical direct DB walk-forward when no snapshot is present"
        required: false
        default: "false"
      optimizer_data_dir:
        description: "Immutable parquet-feed dir recorded in compiled snapshot manifests"
        required: false
        default: "/tmp/ploy-parquet"
      data_profile:
        description: "Project data requirements profile for fresh snapshots"
        type: choice
        required: true
        default: "pm5d-execution"
        options:
          - pm5d-execution
          - pm5d-vol
          - all
          - custom
      custom_required_sources:
        description: "Comma-separated sources when data_profile=custom"
        required: false
        default: ""
      audit_lookback_hours:
        description: "Market-data audit lookback in hours"
        required: false
        default: "168"
      data_gate:
        description: "Fail threshold for required-source audit"
        type: choice
        required: true
        default: "never"
        options:
          - critical
          - warn
          - never

concurrency:
  group: factor-walk-forward-v2-${{ github.event.inputs.git_ref }}-${{ github.event.inputs.factor_name_filter || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PLOY_DB_URL: ${{ secrets.PLOY_DB_URL }}

jobs:
  walk-forward:
    name: Run factor walk-forward on ploy-ci-1
    runs-on: [self-hosted, ploy-ci-1]
    timeout-minutes: 60
    environment: ploy-ci-1

    steps:
      - name: Repair runner workspace permissions
        run: |
          if [ -d "${GITHUB_WORKSPACE}" ]; then
            sudo chown -R "$(id -un):$(id -gn)" "${GITHUB_WORKSPACE}" || true
            sudo rm -f "${GITHUB_WORKSPACE}/.cargo-lock" || true
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Add cargo to PATH
        run: echo "/home/runner/.cargo/bin" >> "$GITHUB_PATH"

      - name: Ensure psql client
        if: ${{ github.event.inputs.snapshot_run_id == '' && github.event.inputs.compile_snapshot == 'true' }}
        run: |
          set -euo pipefail
          if command -v psql >/dev/null 2>&1; then
            psql --version
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          else
            echo "psql client is required for scoped data audits" >&2
            exit 1
          fi

      - name: Resolve data requirements
        id: data_scope
        if: ${{ github.event.inputs.snapshot_run_id == '' && github.event.inputs.compile_snapshot == 'true' }}
        env:
          DATA_PROFILE: ${{ github.event.inputs.data_profile }}
          CUSTOM_REQUIRED_SOURCES: ${{ github.event.inputs.custom_required_sources }}
        run: |
          set -euo pipefail
          case "${DATA_PROFILE}" in
            pm5d-execution)
              required_sources="polymarket_quotes,polymarket_orderbooks,binance_price,binance_agg_trades,binance_lob"
              include_deribit="false"
              ;;
            pm5d-vol)
              required_sources="polymarket_quotes,polymarket_orderbooks,deribit_iv,deribit_atm_greeks,binance_price,binance_agg_trades,binance_lob"
              include_deribit="true"
              ;;
            all)
              required_sources="all"
              include_deribit="true"
              ;;
            custom)
              required_sources="${CUSTOM_REQUIRED_SOURCES}"
              if [ -z "${required_sources}" ]; then
                echo "custom_required_sources is required when data_profile=custom" >&2
                exit 2
              fi
              include_deribit="false"
              case ",${required_sources}," in
                *deribit*|*,all,*|*,pm5d-vol,*) include_deribit="true" ;;
              esac
              ;;
            *)
              echo "unsupported data_profile=${DATA_PROFILE}" >&2
              exit 2
              ;;
          esac
          echo "required_sources=${required_sources}" >> "${GITHUB_OUTPUT}"
          echo "include_deribit=${include_deribit}" >> "${GITHUB_OUTPUT}"

      - name: Audit required market data
        id: data_audit
        if: ${{ github.event.inputs.snapshot_run_id == '' && github.event.inputs.compile_snapshot == 'true' }}
        env:
          REQUIRED_SOURCES: ${{ steps.data_scope.outputs.required_sources }}
          AUDIT_LOOKBACK_HOURS: ${{ github.event.inputs.audit_lookback_hours }}
          DATA_GATE: ${{ github.event.inputs.data_gate }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/research-snapshot
          PLOY_DATABASE__URL="${PLOY_DB_URL:?PLOY_DB_URL secret is required}" \
            scripts/audit_market_data_gaps.py \
              --lookback-hours "${AUDIT_LOOKBACK_HOURS}" \
              --bucket-minutes 5 \
              --symbols "${{ github.event.inputs.symbols }}" \
              --required-sources "${REQUIRED_SOURCES}" \
              --statement-timeout-seconds 20 \
              --psql-timeout-seconds 30 \
              --format json \
              --fail-on never > artifacts/research-snapshot/data-gap-audit.json
          python3 <<'PY'
          import json
          import os

          status_order = {"ok": 0, "warn": 1, "unknown": 2, "critical": 3}
          gate = os.environ["DATA_GATE"]
          with open("artifacts/research-snapshot/data-gap-audit.json", encoding="utf-8") as fh:
              payload = json.load(fh)
          status = payload.get("overall_status", "unknown")
          lines = [
              "# Scoped Data Audit",
              "",
              f"- Gate: `{gate}`",
              f"- Overall: `{status}`",
              f"- Required sources: `{','.join(payload.get('required_sources') or [])}`",
              f"- Lookback: `{payload.get('lookback_hours')}h`",
              "",
              "| Source | Status | Reasons |",
              "| --- | --- | --- |",
          ]
          for item in payload.get("gap_audits", []) + payload.get("window_audits", []):
              lines.append(
                  f"| `{item.get('source_id')}` | `{item.get('status', 'unknown')}` | "
                  f"{'; '.join(item.get('reasons') or [])} |"
              )
          summary = "\n".join(lines) + "\n"
          with open("artifacts/research-snapshot/data-gap-audit.md", "w", encoding="utf-8") as fh:
              fh.write(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"overall_status={status}\n")
          should_fail = (
              (gate == "critical" and status in {"critical", "unknown"})
              or (gate == "warn" and status_order.get(status, 2) >= status_order["warn"])
          )
          if should_fail:
              raise SystemExit(f"scoped data audit gate failed: {status}")
          PY

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-targets: "true"
          key: factor-walk-forward-v2-${{ hashFiles('crates/ploy-research/**', 'crates/ploy-feed-loaders/**', 'Cargo.lock') }}

      - name: Build factor walk-forward and snapshot compiler
        run: |
          . /home/runner/.cargo/env
          cargo build --release --locked \
            -p ploy-research \
            --features db,polars-export \
            --example factor_walk_forward_v2 \
            --example research_snapshot_compile

      - name: Download research snapshot
        if: ${{ github.event.inputs.snapshot_run_id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT_RUN_ID: ${{ github.event.inputs.snapshot_run_id }}
        run: |
          set -euo pipefail
          rm -rf artifacts/research-snapshot
          python3 scripts/download_github_artifact.py \
            --run-id "${SNAPSHOT_RUN_ID}" \
            --name "research-snapshot-${SNAPSHOT_RUN_ID}" \
            --output-dir artifacts/research-snapshot \
            --require manifest.json \
            --require quality.md

      - name: Compile research snapshot
        if: ${{ github.event.inputs.snapshot_run_id == '' && github.event.inputs.compile_snapshot == 'true' }}
        run: |
          set -euo pipefail
          deribit_args=()
          if [ "${{ steps.data_scope.outputs.include_deribit }}" != "true" ]; then
            deribit_args+=(--skip-deribit)
          fi
          mkdir -p artifacts/research-snapshot
          ./target/release/examples/research_snapshot_compile \
            --db-url "${PLOY_DB_URL:?PLOY_DB_URL secret is required}" \
            --symbols "${{ github.event.inputs.symbols }}" \
            --start-date "${{ github.event.inputs.start_date }}" \
            --end-date "${{ github.event.inputs.end_date }}" \
            --stake-usd "${{ github.event.inputs.stake_usd }}" \
            --lob-sample-secs "${{ github.event.inputs.lob_sample_secs }}" \
            --observation-sample-secs "${{ github.event.inputs.observation_sample_secs }}" \
            --max-quote-age-secs "${{ github.event.inputs.max_quote_age_secs }}" \
            --output-dir artifacts/research-snapshot \
            --optimizer-data-dir "${{ github.event.inputs.optimizer_data_dir }}" \
            --data-requirements "${{ steps.data_scope.outputs.required_sources }}" \
            --data-audit-status "${{ steps.data_audit.outputs.overall_status }}" \
            --data-audit-report data-gap-audit.json \
            "${deribit_args[@]}" \
            2>&1 | tee artifacts/research-snapshot/compile.log

      - name: Run factor walk-forward
        run: |
          set -euo pipefail
          mkdir -p artifacts/factor-walk-forward-v2
          source_args=()
          if [ -f artifacts/research-snapshot/manifest.json ]; then
            source_args=(--snapshot-dir artifacts/research-snapshot)
            echo "canonical_result=snapshot" | tee artifacts/factor-walk-forward-v2/source.txt
          elif [ "${{ github.event.inputs.allow_direct_db_debug }}" = "true" ]; then
            source_args=(--db-url "${PLOY_DB_URL:?PLOY_DB_URL secret is required}" --allow-direct-db-debug)
            echo "canonical_result=no direct_db_debug=true" | tee artifacts/factor-walk-forward-v2/source.txt
          else
            echo "ERROR: no research snapshot is present; set compile_snapshot=true, pass snapshot_run_id, or explicitly set allow_direct_db_debug=true" >&2
            exit 2
          fi
          args=(
            "${source_args[@]}"
            --symbols "${{ github.event.inputs.symbols }}"
            --start-date "${{ github.event.inputs.start_date }}"
            --end-date "${{ github.event.inputs.end_date }}"
            --stake-usd "${{ github.event.inputs.stake_usd }}"
            --train-window-days "${{ github.event.inputs.train_window_days }}"
            --test-window-days "${{ github.event.inputs.test_window_days }}"
            --step-days "${{ github.event.inputs.step_days }}"
            --lob-sample-secs "${{ github.event.inputs.lob_sample_secs }}"
            --observation-sample-secs "${{ github.event.inputs.observation_sample_secs }}"
            --max-quote-age-secs "${{ github.event.inputs.max_quote_age_secs }}"
            --min-observations "${{ github.event.inputs.min_observations }}"
            --top-quantile "${{ github.event.inputs.top_quantile }}"
            --top-n "${{ github.event.inputs.top_n }}"
          )
          if [ -n "${{ github.event.inputs.factor_name_filter }}" ]; then
            args+=(--factor-name-filter "${{ github.event.inputs.factor_name_filter }}")
          fi
          ./target/release/examples/factor_walk_forward_v2 "${args[@]}" \
            | tee artifacts/factor-walk-forward-v2/report.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Factor Walk-Forward V2"
            echo ""
            echo "- Window: ${{ github.event.inputs.start_date }} -> ${{ github.event.inputs.end_date }}"
            echo "- Train/Test: ${{ github.event.inputs.train_window_days }}d / ${{ github.event.inputs.test_window_days }}d"
            echo "- Symbols: ${{ github.event.inputs.symbols }}"
            echo "- Stake: ${{ github.event.inputs.stake_usd }}U"
            echo "- Factor filter: ${{ github.event.inputs.factor_name_filter || '<none>' }}"
            if [ -f artifacts/factor-walk-forward-v2/source.txt ]; then
              echo "- Source: $(cat artifacts/factor-walk-forward-v2/source.txt)"
            fi
            if [ -f artifacts/research-snapshot/data-gap-audit.md ]; then
              echo ""
              cat artifacts/research-snapshot/data-gap-audit.md
            fi
            echo ""
            if [ -f artifacts/research-snapshot/quality.md ]; then
              echo "### Snapshot Quality"
              cat artifacts/research-snapshot/quality.md
              echo ""
            fi
            if [ -f artifacts/factor-walk-forward-v2/report.txt ]; then
              echo '```'
              sed -n '1,160p' artifacts/factor-walk-forward-v2/report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: factor-walk-forward-v2-${{ github.run_id }}
          path: |
            artifacts/factor-walk-forward-v2/
            artifacts/research-snapshot/
          retention-days: 14
