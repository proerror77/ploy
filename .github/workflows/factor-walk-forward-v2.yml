name: Factor Walk-Forward V2

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref"
        required: true
        default: "main"
      start_date:
        description: "Review start date (YYYY-MM-DD)"
        required: true
        default: "2026-04-21"
      end_date:
        description: "Review end date (YYYY-MM-DD)"
        required: true
        default: "2026-04-25"
      symbols:
        description: "Comma-separated Binance symbols"
        required: true
        default: "BTCUSDT,ETHUSDT,SOLUSDT,DOGEUSDT,BNBUSDT,XRPUSDT"
      stake_usd:
        description: "Fixed notional per candidate"
        required: true
        default: "15"
      snapshot_run_id:
        description: "Optional Research Snapshot workflow run id to consume"
        required: false
        default: ""
      options_json:
        description: "Advanced options JSON: walk windows, factor filters, snapshot/data/audit settings, local snapshot registry, optional replay parity artifact"
        required: false
        default: '{"train_window_days":2,"test_window_days":1,"step_days":1,"lob_sample_secs":30,"observation_sample_secs":30,"max_quote_age_secs":30,"top_n":20,"min_observations":20,"top_quantile":0.2,"factor_name_filter":"","compile_snapshot":true,"allow_direct_db_debug":false,"optimizer_data_dir":"/tmp/ploy-parquet","data_profile":"pm5d-execution","custom_required_sources":"","audit_lookback_hours":168,"data_gate":"never","data_quality_mode":"strict_continuous","min_event_complete_events":20,"min_event_complete_rows":40,"issue_number":"","snapshot_registry_dir":"","replay_parity_json":"","replay_parity_run_id":"","replay_parity_artifact_name":""}'

concurrency:
  group: factor-walk-forward-v2-${{ github.event.inputs.git_ref }}-${{ github.event.inputs.start_date }}-${{ github.event.inputs.end_date }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PLOY_DB_URL: ${{ secrets.PLOY_DB_URL }}

jobs:
  walk-forward:
    name: Run factor walk-forward on ploy-ci-1
    runs-on: [self-hosted, ploy-ci-1]
    timeout-minutes: 60
    environment: ploy-ci-1

    steps:
      - name: Repair runner workspace permissions
        run: |
          if [ -d "${GITHUB_WORKSPACE}" ]; then
            sudo chown -R "$(id -un):$(id -gn)" "${GITHUB_WORKSPACE}" || true
            sudo rm -f "${GITHUB_WORKSPACE}/.cargo-lock" || true
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Add cargo to PATH
        run: echo "/home/runner/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure snapshot-reuse cargo target
        if: ${{ github.event.inputs.snapshot_run_id != '' }}
        run: |
          scripts/configure_research_cargo_target.sh \
            --profile pm5d-factor-research \
            --features db

      - name: Parse advanced options
        env:
          OPTIONS_JSON: ${{ github.event.inputs.options_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          defaults = {
              "train_window_days": "2",
              "test_window_days": "1",
              "step_days": "1",
              "lob_sample_secs": "30",
              "observation_sample_secs": "30",
              "max_quote_age_secs": "30",
              "top_n": "20",
              "min_observations": "20",
              "top_quantile": "0.2",
              "factor_name_filter": "",
              "compile_snapshot": "true",
              "allow_direct_db_debug": "false",
              "optimizer_data_dir": "/tmp/ploy-parquet",
              "data_profile": "pm5d-execution",
              "custom_required_sources": "",
              "audit_lookback_hours": "168",
              "data_gate": "never",
              "data_quality_mode": "strict_continuous",
              "min_event_complete_events": "20",
              "min_event_complete_rows": "40",
              "issue_number": "",
              "snapshot_registry_dir": "",
              "replay_parity_json": "",
              "replay_parity_run_id": "",
              "replay_parity_artifact_name": "",
          }
          bool_keys = {"compile_snapshot", "allow_direct_db_debug"}
          choices = {
              "data_profile": {"pm5d-execution", "pm5d-vol", "all", "custom"},
              "data_gate": {"critical", "warn", "never"},
              "data_quality_mode": {"strict_continuous", "event_complete"},
          }
          raw = os.environ.get("OPTIONS_JSON", "").strip()
          data = json.loads(raw) if raw else {}
          if not isinstance(data, dict):
              raise SystemExit("options_json must be a JSON object")
          unknown = sorted(set(data) - set(defaults))
          if unknown:
              raise SystemExit(f"unknown options_json keys: {', '.join(unknown)}")

          values = dict(defaults)
          for key, value in data.items():
              if key in bool_keys:
                  if isinstance(value, bool):
                      values[key] = "true" if value else "false"
                  elif str(value).lower() in {"true", "false"}:
                      values[key] = str(value).lower()
                  else:
                      raise SystemExit(f"options_json value for {key} must be boolean")
              else:
                  values[key] = str(value)
              if key in choices and values[key] not in choices[key]:
                  allowed = ", ".join(sorted(choices[key]))
                  raise SystemExit(f"options_json value for {key} must be one of: {allowed}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  if "\n" in value:
                      raise SystemExit(f"options_json value for {key} must be single-line")
                  handle.write(f"WALK_{key.upper()}={value}\n")
          PY

      - name: Ensure psql client
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.snapshot_run_id }}" ] || [ "${WALK_COMPILE_SNAPSHOT}" != "true" ]; then
            echo "No fresh snapshot requested; skipping psql client check."
            exit 0
          fi
          if command -v psql >/dev/null 2>&1; then
            psql --version
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          else
            echo "psql client is required for scoped data audits" >&2
            exit 1
          fi

      - name: Resolve data requirements
        id: data_scope
        run: |
          set -euo pipefail
          DATA_PROFILE="${WALK_DATA_PROFILE}"
          CUSTOM_REQUIRED_SOURCES="${WALK_CUSTOM_REQUIRED_SOURCES}"
          case "${DATA_PROFILE}" in
            pm5d-execution)
              required_sources="polymarket_quotes,polymarket_orderbooks,binance_price,binance_agg_trades,binance_lob"
              include_deribit="false"
              ;;
            pm5d-vol)
              required_sources="polymarket_quotes,polymarket_orderbooks,deribit_iv,deribit_atm_greeks,binance_price,binance_agg_trades,binance_lob"
              include_deribit="true"
              ;;
            all)
              required_sources="all"
              include_deribit="true"
              ;;
            custom)
              required_sources="${CUSTOM_REQUIRED_SOURCES}"
              if [ -z "${required_sources}" ]; then
                echo "custom_required_sources is required when data_profile=custom" >&2
                exit 2
              fi
              include_deribit="false"
              case ",${required_sources}," in
                *deribit*|*,all,*|*,pm5d-vol,*) include_deribit="true" ;;
              esac
              ;;
            *)
              echo "unsupported data_profile=${DATA_PROFILE}" >&2
              exit 2
              ;;
          esac
          echo "required_sources=${required_sources}" >> "${GITHUB_OUTPUT}"
          echo "include_deribit=${include_deribit}" >> "${GITHUB_OUTPUT}"

      - name: Audit required market data
        id: data_audit
        env:
          REQUIRED_SOURCES: ${{ steps.data_scope.outputs.required_sources }}
        run: |
          set -euo pipefail
          AUDIT_LOOKBACK_HOURS="${WALK_AUDIT_LOOKBACK_HOURS}"
          export DATA_GATE="${WALK_DATA_GATE}"
          if [ -n "${{ github.event.inputs.snapshot_run_id }}" ] || [ "${WALK_COMPILE_SNAPSHOT}" != "true" ]; then
            echo "No fresh snapshot requested; skipping scoped data audit."
            echo "overall_status=skipped" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          mkdir -p artifacts/research-snapshot
          PLOY_DATABASE__URL="${PLOY_DB_URL:?PLOY_DB_URL secret is required}" \
            scripts/audit_market_data_gaps.py \
              --lookback-hours "${AUDIT_LOOKBACK_HOURS}" \
              --bucket-minutes 5 \
              --symbols "${{ github.event.inputs.symbols }}" \
              --required-sources "${REQUIRED_SOURCES}" \
              --statement-timeout-seconds 20 \
              --psql-timeout-seconds 30 \
              --format json \
              --fail-on never > artifacts/research-snapshot/data-gap-audit.json
          python3 <<'PY'
          import json
          import os

          status_order = {"ok": 0, "warn": 1, "unknown": 2, "critical": 3}
          gate = os.environ["DATA_GATE"]
          with open("artifacts/research-snapshot/data-gap-audit.json", encoding="utf-8") as fh:
              payload = json.load(fh)
          status = payload.get("overall_status", "unknown")
          lines = [
              "# Scoped Data Audit",
              "",
              f"- Gate: `{gate}`",
              f"- Overall: `{status}`",
              f"- Required sources: `{','.join(payload.get('required_sources') or [])}`",
              f"- Lookback: `{payload.get('lookback_hours')}h`",
              "",
              "| Source | Status | Reasons |",
              "| --- | --- | --- |",
          ]
          for item in payload.get("gap_audits", []) + payload.get("window_audits", []):
              lines.append(
                  f"| `{item.get('source_id')}` | `{item.get('status', 'unknown')}` | "
                  f"{'; '.join(item.get('reasons') or [])} |"
              )
          summary = "\n".join(lines) + "\n"
          with open("artifacts/research-snapshot/data-gap-audit.md", "w", encoding="utf-8") as fh:
              fh.write(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"overall_status={status}\n")
          should_fail = (
              (gate == "critical" and status in {"critical", "unknown"})
              or (gate == "warn" and status_order.get(status, 2) >= status_order["warn"])
          )
          if should_fail:
              raise SystemExit(f"scoped data audit gate failed: {status}")
          PY

      - name: Download research snapshot
        if: ${{ github.event.inputs.snapshot_run_id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT_RUN_ID: ${{ github.event.inputs.snapshot_run_id }}
        run: |
          set -euo pipefail
          rm -rf artifacts/research-snapshot
          registry_args=()
          if [ -n "${WALK_SNAPSHOT_REGISTRY_DIR}" ]; then
            registry_args=(--registry-dir "${WALK_SNAPSHOT_REGISTRY_DIR}")
          fi
          if scripts/restore_research_snapshot.sh \
            --run-id "${SNAPSHOT_RUN_ID}" \
            --output-dir artifacts/research-snapshot \
            --require manifest.json \
            --require quality.md \
            "${registry_args[@]}"; then
            echo "Restored runner-local research snapshot."
            exit 0
          fi
          cache_args=()
          if [ -n "${RUNNER_WORKSPACE:-}" ]; then
            cache_args=(--cache-dir "${RUNNER_WORKSPACE}/_ploy-research-artifacts")
          fi
          if python3 scripts/download_github_artifact.py \
            --run-id "${SNAPSHOT_RUN_ID}" \
            --name "research-snapshot-${SNAPSHOT_RUN_ID}" \
            --output-dir artifacts/research-snapshot \
            --require manifest.json \
            --require quality.md \
            "${cache_args[@]}"; then
            echo "Downloaded standalone research snapshot artifact."
          else
            echo "Standalone research snapshot artifact not found; trying embedded downstream artifacts."
            python3 scripts/download_github_artifact.py \
              --run-id "${SNAPSHOT_RUN_ID}" \
              --name "factor-walk-forward-v2-${SNAPSHOT_RUN_ID}" \
              --strip-prefix research-snapshot \
              --output-dir artifacts/research-snapshot \
              --require manifest.json \
              --require quality.md \
              "${cache_args[@]}" \
            || python3 scripts/download_github_artifact.py \
              --run-id "${SNAPSHOT_RUN_ID}" \
              --name "factor-review-v2-${SNAPSHOT_RUN_ID}" \
              --strip-prefix research-snapshot \
              --output-dir artifacts/research-snapshot \
              --require manifest.json \
              --require quality.md \
              "${cache_args[@]}"
          fi

      - name: Download replay parity artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${WALK_REPLAY_PARITY_JSON}" ] || [ -z "${WALK_REPLAY_PARITY_RUN_ID}" ]; then
            echo "No replay parity artifact download requested."
            exit 0
          fi
          rm -rf artifacts/replay-parity
          artifact_name="${WALK_REPLAY_PARITY_ARTIFACT_NAME}"
          if [ -z "${artifact_name}" ]; then
            artifact_name="replay-dryrun-parity-${WALK_REPLAY_PARITY_RUN_ID}"
          fi
          python3 scripts/download_github_artifact.py \
            --run-id "${WALK_REPLAY_PARITY_RUN_ID}" \
            --name "${artifact_name}" \
            --output-dir artifacts/replay-parity \
            --require parity-evaluation.json

      - name: Cache cargo build
        if: ${{ github.event.inputs.snapshot_run_id == '' }}
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-targets: "true"
          key: factor-walk-forward-v2-db-only-${{ hashFiles('crates/ploy-research/**', 'crates/ploy-feed-loaders/**', 'Cargo.lock') }}

      - name: Build factor walk-forward
        run: |
          set -euo pipefail
          . /home/runner/.cargo/env
          build_args=(
            --release
            --locked
            -p ploy-research
            --features db
            --example factor_walk_forward_v2
          )
          if [ -z "${{ github.event.inputs.snapshot_run_id }}" ]; then
            build_args+=(--example research_snapshot_compile)
          fi
          cargo build "${build_args[@]}"
          if [ -n "${CARGO_TARGET_DIR:-}" ]; then
            mkdir -p target/release/examples
            for binary in factor_walk_forward_v2 research_snapshot_compile; do
              if [ -x "${CARGO_TARGET_DIR}/release/examples/${binary}" ]; then
                cp "${CARGO_TARGET_DIR}/release/examples/${binary}" "target/release/examples/${binary}"
              fi
            done
          fi

      - name: Compile research snapshot
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.snapshot_run_id }}" ] || [ "${WALK_COMPILE_SNAPSHOT}" != "true" ]; then
            echo "No fresh snapshot requested; skipping snapshot compile."
            exit 0
          fi
          deribit_args=()
          if [ "${{ steps.data_scope.outputs.include_deribit }}" != "true" ]; then
            deribit_args+=(--skip-deribit)
          fi
          mkdir -p artifacts/research-snapshot
          ./target/release/examples/research_snapshot_compile \
            --db-url "${PLOY_DB_URL:?PLOY_DB_URL secret is required}" \
            --symbols "${{ github.event.inputs.symbols }}" \
            --start-date "${{ github.event.inputs.start_date }}" \
            --end-date "${{ github.event.inputs.end_date }}" \
            --stake-usd "${{ github.event.inputs.stake_usd }}" \
            --lob-sample-secs "${WALK_LOB_SAMPLE_SECS}" \
            --observation-sample-secs "${WALK_OBSERVATION_SAMPLE_SECS}" \
            --max-quote-age-secs "${WALK_MAX_QUOTE_AGE_SECS}" \
            --output-dir artifacts/research-snapshot \
            --optimizer-data-dir "${WALK_OPTIMIZER_DATA_DIR}" \
            --data-requirements "${{ steps.data_scope.outputs.required_sources }}" \
            --data-audit-status "${{ steps.data_audit.outputs.overall_status }}" \
            --data-audit-report data-gap-audit.json \
            "${deribit_args[@]}" \
            2>&1 | tee artifacts/research-snapshot/compile.log

      - name: Publish snapshot to runner-local registry
        if: ${{ github.event.inputs.snapshot_run_id == '' }}
        run: |
          set -euo pipefail
          if [ "${WALK_COMPILE_SNAPSHOT}" != "true" ] || [ ! -f artifacts/research-snapshot/manifest.json ]; then
            echo "No freshly compiled snapshot to publish."
            exit 0
          fi
          registry_args=()
          if [ -n "${WALK_SNAPSHOT_REGISTRY_DIR}" ]; then
            registry_args=(--registry-dir "${WALK_SNAPSHOT_REGISTRY_DIR}")
          fi
          scripts/publish_research_snapshot_registry.sh \
            --snapshot-dir artifacts/research-snapshot \
            --run-id "${GITHUB_RUN_ID}" \
            --retention-days 14 \
            "${registry_args[@]}"

      - name: Run factor walk-forward
        run: |
          set -euo pipefail
          mkdir -p artifacts/factor-walk-forward-v2
          source_args=()
          if [ -f artifacts/research-snapshot/manifest.json ]; then
            source_args=(--snapshot-dir artifacts/research-snapshot)
            echo "canonical_result=snapshot" | tee artifacts/factor-walk-forward-v2/source.txt
          elif [ "${WALK_ALLOW_DIRECT_DB_DEBUG}" = "true" ]; then
            source_args=(--db-url "${PLOY_DB_URL:?PLOY_DB_URL secret is required}" --allow-direct-db-debug)
            echo "canonical_result=no direct_db_debug=true" | tee artifacts/factor-walk-forward-v2/source.txt
          else
            echo "ERROR: no research snapshot is present; set compile_snapshot=true, pass snapshot_run_id, or explicitly set allow_direct_db_debug=true" >&2
            exit 2
          fi
          args=(
            "${source_args[@]}"
            --symbols "${{ github.event.inputs.symbols }}"
            --start-date "${{ github.event.inputs.start_date }}"
            --end-date "${{ github.event.inputs.end_date }}"
            --stake-usd "${{ github.event.inputs.stake_usd }}"
            --train-window-days "${WALK_TRAIN_WINDOW_DAYS}"
            --test-window-days "${WALK_TEST_WINDOW_DAYS}"
            --step-days "${WALK_STEP_DAYS}"
            --lob-sample-secs "${WALK_LOB_SAMPLE_SECS}"
            --observation-sample-secs "${WALK_OBSERVATION_SAMPLE_SECS}"
            --max-quote-age-secs "${WALK_MAX_QUOTE_AGE_SECS}"
            --min-observations "${WALK_MIN_OBSERVATIONS}"
            --top-quantile "${WALK_TOP_QUANTILE}"
            --top-n "${WALK_TOP_N}"
            --data-quality-mode "${WALK_DATA_QUALITY_MODE}"
            --min-event-complete-events "${WALK_MIN_EVENT_COMPLETE_EVENTS}"
            --min-event-complete-rows "${WALK_MIN_EVENT_COMPLETE_ROWS}"
          )
          if [ -n "${WALK_FACTOR_NAME_FILTER}" ]; then
            args+=(--factor-name-filter "${WALK_FACTOR_NAME_FILTER}")
          fi
          replay_parity_json="${WALK_REPLAY_PARITY_JSON}"
          if [ -z "${replay_parity_json}" ] && [ -f artifacts/replay-parity/parity-evaluation.json ]; then
            replay_parity_json="artifacts/replay-parity/parity-evaluation.json"
          fi
          if [ -n "${replay_parity_json}" ]; then
            args+=(--replay-parity-json "${replay_parity_json}")
          fi
          ./target/release/examples/factor_walk_forward_v2 "${args[@]}" \
            | tee artifacts/factor-walk-forward-v2/report.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Factor Walk-Forward V2"
            echo ""
            echo "- Window: ${{ github.event.inputs.start_date }} -> ${{ github.event.inputs.end_date }}"
            echo "- Train/Test: ${WALK_TRAIN_WINDOW_DAYS}d / ${WALK_TEST_WINDOW_DAYS}d"
            echo "- Symbols: ${{ github.event.inputs.symbols }}"
            echo "- Stake: ${{ github.event.inputs.stake_usd }}U"
            echo "- Factor filter: ${WALK_FACTOR_NAME_FILTER:-<none>}"
            if [ -f artifacts/factor-walk-forward-v2/source.txt ]; then
              echo "- Source: $(cat artifacts/factor-walk-forward-v2/source.txt)"
            fi
            if [ -f artifacts/research-snapshot/data-gap-audit.md ]; then
              echo ""
              cat artifacts/research-snapshot/data-gap-audit.md
            fi
            echo ""
            if [ -f artifacts/research-snapshot/quality.md ]; then
              echo "### Snapshot Quality"
              cat artifacts/research-snapshot/quality.md
              echo ""
            fi
            if [ -f artifacts/factor-walk-forward-v2/report.txt ]; then
              echo '```'
              sed -n '1,160p' artifacts/factor-walk-forward-v2/report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage report artifact
        if: always()
        run: |
          set -euo pipefail
          rm -rf artifacts/factor-walk-forward-v2-upload
          mkdir -p artifacts/factor-walk-forward-v2-upload
          if [ -d artifacts/factor-walk-forward-v2 ]; then
            cp -R artifacts/factor-walk-forward-v2 artifacts/factor-walk-forward-v2-upload/
          fi
          mkdir -p artifacts/factor-walk-forward-v2-upload/snapshot-provenance
          {
            echo "source_snapshot_run_id=${{ github.event.inputs.snapshot_run_id }}"
            echo "producer_run_id=${GITHUB_RUN_ID}"
            echo "full_snapshot_embedded=false"
            echo "registry=runner-local"
          } > artifacts/factor-walk-forward-v2-upload/snapshot-provenance/source.txt
          for file in manifest.json quality.md data-gap-audit.md data-gap-audit.json compile.log; do
            if [ -f "artifacts/research-snapshot/${file}" ]; then
              cp "artifacts/research-snapshot/${file}" \
                "artifacts/factor-walk-forward-v2-upload/snapshot-provenance/${file}"
            fi
          done

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: factor-walk-forward-v2-${{ github.run_id }}
          path: artifacts/factor-walk-forward-v2-upload/
          compression-level: 0
          retention-days: 14

      - name: Comment walk-forward evidence on issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { applyResearchIssueLabels } = require("./.github/scripts/research-issue-labels.js");
            const issueNumberRaw = process.env.WALK_ISSUE_NUMBER || "";
            if (!issueNumberRaw) {
              core.info("No issue_number configured in options_json; skipping issue comment.");
              return;
            }
            const issue_number = Number(issueNumberRaw);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              "Factor walk-forward evidence:",
              "",
              `- Workflow: ${context.workflow}`,
              `- Run URL: ${runUrl}`,
              `- Git ref: ${{ github.event.inputs.git_ref }}`,
              `- Dataset/window: ${{ github.event.inputs.start_date }} -> ${{ github.event.inputs.end_date }}`,
              `- Symbols: ${{ github.event.inputs.symbols }}`,
              `- Artifact: \`factor-walk-forward-v2-${process.env.GITHUB_RUN_ID}\``,
              "- Decision: pending"
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
            await applyResearchIssueLabels({
              github,
              context,
              core,
              issue_number,
              labels: ["evidence:walk-forward", "decision:pending"]
            });
