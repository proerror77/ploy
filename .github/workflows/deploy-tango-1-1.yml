name: Deploy to tango-1-1

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: true
        default: "main"

concurrency:
  group: deploy-tango-1-1-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PLATFORM_TARGET: x86_64-unknown-linux-gnu
  DEPLOY_HOST: ${{ secrets.TANGO_1_1_HOST }}

jobs:
  build-and-deploy:
    name: Build and deploy to tango-1-1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: tango-1-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.PLATFORM_TARGET }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld openssh-client

      - name: Build ploy-runner
        run: |
          cargo clean -p ploy-runner
          cargo build --release --locked \
            --target "${PLATFORM_TARGET}" \
            -p ploy-runner
          strip "target/${PLATFORM_TARGET}/release/ploy-runner" || true

      - name: Configure SSH for deploy
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.TANGO_1_1_SSH_KEY }}' > ~/.ssh/tango_1_1_key
          chmod 600 ~/.ssh/tango_1_1_key
          cat > ~/.ssh/config <<EOF
          Host tango-1-1
            HostName ${DEPLOY_HOST}
            User root
            IdentityFile ~/.ssh/tango_1_1_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 20
            ConnectTimeout 30
          EOF

      - name: Prepare remote directories
        run: |
          ssh tango-1-1 'mkdir -p /root/ploy/bin /root/ploy/config/strategies /root/ploy/migrations'

      - name: Upload binary to tango-1-1
        run: |
          for attempt in 1 2 3; do
            ssh tango-1-1 'rm -f /root/ploy/bin/ploy-runner.new && cat > /root/ploy/bin/ploy-runner.new' < target/${PLATFORM_TARGET}/release/ploy-runner
            ssh tango-1-1 'mv /root/ploy/bin/ploy-runner.new /root/ploy/bin/ploy-runner'
            exit 0
            echo "binary upload attempt ${attempt} failed" >&2
            sleep 10
          done
          exit 1

      - name: Upload config to tango-1-1
        run: |
          scp -O config/strategies/02-pm5d.unified.toml tango-1-1:/root/ploy/config/strategies/02-pm5d.unified.toml

      - name: Upload required migrations to tango-1-1
        run: |
          scp -O migrations/027_reference_price_ticks.sql tango-1-1:/root/ploy/migrations/027_reference_price_ticks.sql
          scp -O migrations/028_pm_market_catalog.sql tango-1-1:/root/ploy/migrations/028_pm_market_catalog.sql
          scp -O migrations/029_sports_state_events.sql tango-1-1:/root/ploy/migrations/029_sports_state_events.sql

      - name: Restart ploy-runner services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.TANGO_1_1_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            # Make binary executable
            chmod +x /root/ploy/bin/ploy-runner

            # Apply additive runner migrations before restarting services.
            mkdir -p /root/ploy/migrations
            for migration in \
              /root/ploy/migrations/027_reference_price_ticks.sql \
              /root/ploy/migrations/028_pm_market_catalog.sql \
              /root/ploy/migrations/029_sports_state_events.sql; do
              if [ -f "${migration}" ]; then
                PGPASSWORD=postgres psql -U postgres -d ploy -v ON_ERROR_STOP=1 -f "${migration}"
              fi
            done

            systemctl restart ploy-strategy-directional-dryrun || echo "Service not running: ploy-strategy-directional-dryrun"
            systemctl restart ploy-quote-collector || echo "Service not running: ploy-quote-collector"

            # Check service status
            sleep 2
            systemctl status ploy-strategy-directional-dryrun --no-pager || true
            systemctl status ploy-quote-collector --no-pager || true

            # Show recent logs
            journalctl -u ploy-strategy-directional-dryrun -n 20 --no-pager
            journalctl -u ploy-quote-collector -n 20 --no-pager

      - name: Deployment summary
        run: |
          echo "## Deployment to tango-1-1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Binary: \`ploy-runner\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${{ secrets.TANGO_1_1_HOST }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Services: \`ploy-strategy-directional-dryrun\`, \`ploy-quote-collector\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git ref: \`${{ github.event.inputs.git_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
