name: Deploy to tango-1-1

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: true
        default: "main"

concurrency:
  group: deploy-tango-1-1-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PLATFORM_TARGET: x86_64-unknown-linux-gnu
  DEPLOY_HOST: ${{ secrets.TANGO_1_1_HOST }}
  DEPLOY_OSS_REGION: ${{ vars.ALIYUN_REGION || 'ap-northeast-1' }}
  DEPLOY_OSS_PREFIX: deploy/tango-1-1
  DEPLOY_BUNDLE_NAME: ploy-runner-tango-1-1.tar.gz
  DEPLOY_MIGRATIONS: >-
    027_reference_price_ticks.sql
    028_pm_market_catalog.sql
    029_sports_state_events.sql
    030_strategy_runtime_execution_audit.sql
    031_strategy_runtime_track_record_views.sql
    032_strategy_runtime_track_record_official_settlement.sql
    033_fix_settlement_view_join_and_confirmed_flag.sql

jobs:
  build-and-deploy:
    name: Build and deploy to tango-1-1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: tango-1-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.PLATFORM_TARGET }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld openssh-client

      - name: Build ploy-runner
        run: |
          cargo clean -p ploy-runner
          cargo build --release --locked \
            --target "${PLATFORM_TARGET}" \
            -p ploy-runner
          strip "target/${PLATFORM_TARGET}/release/ploy-runner" || true

      - name: Build deploy bundle
        run: |
          rm -rf dist
          mkdir -p dist/bin dist/config/strategies dist/migrations dist/deployment/systemd
          cp target/${PLATFORM_TARGET}/release/ploy-runner dist/bin/ploy-runner
          cp config/strategies/02-pm5d.unified.toml dist/config/strategies/02-pm5d.unified.toml
          for migration in ${DEPLOY_MIGRATIONS}; do
            cp "migrations/${migration}" "dist/migrations/${migration}"
          done
          cp deployment/systemd/ploy-strategy-directional-dryrun.hardening.conf dist/deployment/systemd/ploy-strategy-directional-dryrun.hardening.conf
          cp deployment/systemd/ploy-quote-collector.hardening.conf dist/deployment/systemd/ploy-quote-collector.hardening.conf
          tar -C dist -czf "${DEPLOY_BUNDLE_NAME}" .
          sha256sum "${DEPLOY_BUNDLE_NAME}" > "${DEPLOY_BUNDLE_NAME}.sha256"

      - name: Validate OSS deploy secrets
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          missing=()
          [ -n "${OSS_ACCESS_KEY_ID}" ] || missing+=("ALIYUN_OSS_ACCESS_KEY_ID")
          [ -n "${OSS_ACCESS_KEY_SECRET}" ] || missing+=("ALIYUN_OSS_ACCESS_KEY_SECRET")
          [ -n "${OSS_BUCKET}" ] || missing+=("ALIYUN_OSS_BUCKET")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required OSS deploy secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install ossutil
        run: |
          if ! command -v ossutil >/dev/null 2>&1; then
            curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          fi
          export PATH="/usr/local/bin:/usr/bin:/bin:${PATH}"
          command -v ossutil >/dev/null 2>&1

      - name: Upload deploy bundle to OSS
        id: upload_bundle_to_oss
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          export PATH="/usr/local/bin:/usr/bin:/bin:${PATH}"
          test -n "${OSS_ACCESS_KEY_ID}"
          test -n "${OSS_ACCESS_KEY_SECRET}"
          test -n "${OSS_BUCKET}"
          export OSS_REGION="${DEPLOY_OSS_REGION}"
          export OSS_ENDPOINT="https://oss-${DEPLOY_OSS_REGION}.aliyuncs.com"
          object_prefix="${DEPLOY_OSS_PREFIX}/${GITHUB_SHA}"
          bundle_object="oss://${OSS_BUCKET}/${object_prefix}/${DEPLOY_BUNDLE_NAME}"
          checksum_object="oss://${OSS_BUCKET}/${object_prefix}/${DEPLOY_BUNDLE_NAME}.sha256"
          ossutil cp "${DEPLOY_BUNDLE_NAME}" "${bundle_object}" \
            -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            -e "https://oss-${DEPLOY_OSS_REGION}.aliyuncs.com"
          ossutil cp "${DEPLOY_BUNDLE_NAME}.sha256" "${checksum_object}" \
            -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            -e "https://oss-${DEPLOY_OSS_REGION}.aliyuncs.com"
          echo "bundle_object=${bundle_object}" >> "${GITHUB_OUTPUT}"
          echo "checksum_object=${checksum_object}" >> "${GITHUB_OUTPUT}"

      - name: Configure SSH for deploy
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.TANGO_1_1_SSH_KEY }}' > ~/.ssh/tango_1_1_key
          chmod 600 ~/.ssh/tango_1_1_key
          cat > ~/.ssh/config <<EOF
          Host tango-1-1
            HostName ${DEPLOY_HOST}
            User root
            IdentityFile ~/.ssh/tango_1_1_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 20
            ConnectTimeout 30
          EOF

      - name: Prepare remote directories
        run: |
          ssh tango-1-1 'mkdir -p /root/ploy/bin /root/ploy/config/strategies /root/ploy/migrations /root/ploy/tmp'

      - name: Pull bundle from OSS and restart services
        run: |
          ssh tango-1-1 /bin/bash <<EOF
            set -euo pipefail
            DEPLOY_STARTED_AT=\$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            WORKDIR=/root/ploy/tmp/deploy-${GITHUB_SHA}
            rm -rf "\${WORKDIR}"
            mkdir -p "\${WORKDIR}"

            require_postgres() {
              systemctl is-active --quiet postgresql@16-main
              PGPASSWORD=postgres psql -h localhost -U postgres -d ploy -v ON_ERROR_STOP=1 -Atqc "SELECT 1" >/dev/null
            }

            require_service_guardrails() {
              local unit="\$1"
              local restart_policy
              local oom_policy
              local memory_high
              local memory_max

              restart_policy=\$(systemctl show -P Restart "\${unit}")
              oom_policy=\$(systemctl show -P OOMPolicy "\${unit}")
              memory_high=\$(systemctl show -P MemoryHigh "\${unit}")
              memory_max=\$(systemctl show -P MemoryMax "\${unit}")

              test "\${restart_policy}" = "always"
              test "\${oom_policy}" = "kill"
              test "\${memory_high}" != "[not set]"
              test "\${memory_max}" != "[not set]"
            }

            service_exists() {
              systemctl list-unit-files --type=service --no-legend "\$1" 2>/dev/null | grep -q "^\\$1"
            }

            ensure_ossutil() {
              export PATH="/usr/local/bin:/usr/bin:/bin:\${PATH}"
              if command -v ossutil >/dev/null 2>&1; then
                return 0
              fi
              curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | bash
              export PATH="/usr/local/bin:/usr/bin:/bin:\${PATH}"
              command -v ossutil >/dev/null 2>&1
            }

            ensure_ossutil

            export OSS_ACCESS_KEY_ID='${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}'
            export OSS_ACCESS_KEY_SECRET='${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}'
            export OSS_REGION='${DEPLOY_OSS_REGION}'
            export OSS_ENDPOINT="https://oss-${DEPLOY_OSS_REGION}-internal.aliyuncs.com"
            OSS_BUCKET='${{ secrets.ALIYUN_OSS_BUCKET }}'
            OSS_OBJECT_PREFIX='${DEPLOY_OSS_PREFIX}/${GITHUB_SHA}'

            test -n "\${OSS_ACCESS_KEY_ID}"
            test -n "\${OSS_ACCESS_KEY_SECRET}"
            test -n "\${OSS_BUCKET}"

            ossutil cp "oss://\${OSS_BUCKET}/\${OSS_OBJECT_PREFIX}/${DEPLOY_BUNDLE_NAME}" "\${WORKDIR}/${DEPLOY_BUNDLE_NAME}" \
              -i "\${OSS_ACCESS_KEY_ID}" -k "\${OSS_ACCESS_KEY_SECRET}" \
              -e "\${OSS_ENDPOINT}"
            ossutil cp "oss://\${OSS_BUCKET}/\${OSS_OBJECT_PREFIX}/${DEPLOY_BUNDLE_NAME}.sha256" "\${WORKDIR}/${DEPLOY_BUNDLE_NAME}.sha256" \
              -i "\${OSS_ACCESS_KEY_ID}" -k "\${OSS_ACCESS_KEY_SECRET}" \
              -e "\${OSS_ENDPOINT}"

            cd "\${WORKDIR}"
            sha256sum -c "${DEPLOY_BUNDLE_NAME}.sha256"
            tar -xzf "${DEPLOY_BUNDLE_NAME}"

            # Make binary executable
            install -m 0755 ./bin/ploy-runner /root/ploy/bin/ploy-runner
            install -m 0644 ./config/strategies/02-pm5d.unified.toml /root/ploy/config/strategies/02-pm5d.unified.toml
            for migration in ${DEPLOY_MIGRATIONS}; do
              install -m 0644 "./migrations/${migration}" "/root/ploy/migrations/${migration}"
            done

            install -d /etc/systemd/system/ploy-strategy-directional-dryrun.service.d
            install -d /etc/systemd/system/ploy-quote-collector.service.d
            install -m 0644 ./deployment/systemd/ploy-strategy-directional-dryrun.hardening.conf /etc/systemd/system/ploy-strategy-directional-dryrun.service.d/hardening.conf
            install -m 0644 ./deployment/systemd/ploy-quote-collector.hardening.conf /etc/systemd/system/ploy-quote-collector.service.d/hardening.conf
            systemctl daemon-reload

            # Apply additive runner migrations before restarting services.
            mkdir -p /root/ploy/migrations
            for migration in ${DEPLOY_MIGRATIONS}; do
              migration="/root/ploy/migrations/${migration}"
              if [ -f "\${migration}" ]; then
                PGPASSWORD=postgres psql -U postgres -d ploy -v ON_ERROR_STOP=1 -f "\${migration}"
              fi
            done

            require_postgres

            systemctl restart ploy-strategy-directional-dryrun.service
            systemctl restart ploy-quote-collector.service
            if service_exists ploy-strategy-directional-live.service; then
              systemctl restart ploy-strategy-directional-live.service
            fi

            sleep 5
            require_postgres
            systemctl is-active --quiet ploy-strategy-directional-dryrun.service
            systemctl is-active --quiet ploy-quote-collector.service
            require_service_guardrails ploy-strategy-directional-dryrun.service
            require_service_guardrails ploy-quote-collector.service
            if service_exists ploy-strategy-directional-live.service; then
              systemctl is-active --quiet ploy-strategy-directional-live.service
              require_service_guardrails ploy-strategy-directional-live.service
            fi

            if journalctl -u ploy-strategy-directional-dryrun.service --since "\${DEPLOY_STARTED_AT}" --no-pager \
              | grep -E "DB connection failed|running without persistence|Signal recorder disabled"; then
              echo "ploy-strategy-directional-dryrun started in degraded persistence mode" >&2
              exit 1
            fi

            # Check service status
            systemctl status ploy-strategy-directional-dryrun.service --no-pager
            systemctl status ploy-quote-collector.service --no-pager
            if service_exists ploy-strategy-directional-live.service; then
              systemctl status ploy-strategy-directional-live.service --no-pager
            fi

            # Show recent logs
            journalctl -u ploy-strategy-directional-dryrun.service -n 20 --no-pager
            journalctl -u ploy-quote-collector.service -n 20 --no-pager
            if service_exists ploy-strategy-directional-live.service; then
              journalctl -u ploy-strategy-directional-live.service -n 20 --no-pager
            fi
          EOF

      - name: Deployment summary
        run: |
          echo "## Deployment to tango-1-1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Binary: \`ploy-runner\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${{ secrets.TANGO_1_1_HOST }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Transport: \`GitHub Actions -> OSS -> ECS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- OSS object: \`${{ steps.upload_bundle_to_oss.outputs.bundle_object }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Services: \`ploy-strategy-directional-dryrun\`, \`ploy-quote-collector\`, \`ploy-strategy-directional-live\` (if installed)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git ref: \`${{ github.event.inputs.git_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migrations: \`${DEPLOY_MIGRATIONS}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Postgres pre/postflight: required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Persistence guardrail: deployment fails if dry-run starts without DB-backed recorder" >> "$GITHUB_STEP_SUMMARY"
