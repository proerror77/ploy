name: Deploy to tango-1-1

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: true
        default: "main"
      deploy:
        description: "Push the built bundle to OSS and restart tango-1-1 services"
        type: boolean
        required: true
        default: true

concurrency:
  group: deploy-tango-1-1-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCCACHE_CACHE_SIZE: 10G
  TZ: UTC
  LC_ALL: C
  LANG: C
  PLATFORM_TARGET: x86_64-unknown-linux-gnu
  DEPLOY_HOST: ${{ secrets.TANGO_1_1_HOST }}
  DEPLOY_ROOT: ${{ vars.PLOY_DEPLOY_ROOT || '/opt/ploy' }}
  DEPLOY_OSS_REGION: ${{ vars.ALIYUN_REGION || 'ap-northeast-1' }}
  DEPLOY_OSS_PREFIX: deploy/tango-1-1
  DEPLOY_BUNDLE_NAME: ploy-runner-tango-1-1.tar.gz
  DEPLOY_MIGRATIONS: >-
    027_reference_price_ticks.sql
    028_pm_market_catalog.sql
    029_sports_state_events.sql
    030_strategy_runtime_execution_audit.sql
    031_strategy_runtime_track_record_views.sql
    032_strategy_runtime_track_record_official_settlement.sql
    033_fix_settlement_view_join_and_confirmed_flag.sql
    034_clob_quote_ticks_full_resolution.sql
    035_binance_agg_trade_ticks.sql
    036_research_valid_windows_matview.sql
    037_research_time_conditioned_factor_metrics.sql
    039_fix_strategy_track_record_side_key.sql
    038_track_record_official_residual_settlement.sql

jobs:
  build-and-deploy:
    name: Build and deploy to tango-1-1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: tango-1-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Validate deploy provenance
        if: ${{ inputs.deploy }}
        env:
          INPUT_GIT_REF: ${{ github.event.inputs.git_ref }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Deployments to tango-1-1 must dispatch the workflow from main; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [ "${INPUT_GIT_REF}" != "main" ]; then
            echo "Deployments to tango-1-1 must use git_ref=main; got ${INPUT_GIT_REF}" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin main
          checked_out_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "${checked_out_sha}" != "${main_sha}" ]; then
            echo "Checked-out deploy SHA ${checked_out_sha} does not match origin/main ${main_sha}" >&2
            exit 1
          fi
          echo "Deploy provenance verified: git_ref=main sha=${checked_out_sha}"

      - name: Set reproducible build environment
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91
          targets: ${{ env.PLATFORM_TARGET }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld openssh-client
          sudo apt-get install -y sccache || cargo install sccache --locked
          sudo apt-get install -y mold || true

      - name: Capture cache metadata
        id: cache_meta
        run: |
          echo "rustc_version=$(rustc -Vv | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          echo "sccache_version=$(sccache --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: deploy-tango-1-1-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-deploy-tango-1-1-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-sccache-${{ steps.cache_meta.outputs.sccache_version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-deploy-tango-1-1-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-sccache-${{ steps.cache_meta.outputs.sccache_version }}-
            ${{ runner.os }}-sccache-deploy-tango-1-1-${{ env.PLATFORM_TARGET }}-release-rust-${{ steps.cache_meta.outputs.rustc_version }}-
            ${{ runner.os }}-sccache-deploy-tango-1-1-${{ env.PLATFORM_TARGET }}-release-
            ${{ runner.os }}-sccache-deploy-tango-1-1-
            ${{ runner.os }}-sccache-

      - name: Build new-ploy-runner
        run: |
          cargo build --release --locked \
            --target "${PLATFORM_TARGET}" \
            -p new-ployd \
            -p new-ploy-runner
          strip "target/${PLATFORM_TARGET}/release/new-ployd" || true
          strip "target/${PLATFORM_TARGET}/release/new-ploy-runner" || true

      - name: Build factor-research
        run: |
          cargo build --release --locked \
            --target "${PLATFORM_TARGET}" \
            --features db,polars-export \
            -p ploy-research --example factor_research
          strip "target/${PLATFORM_TARGET}/release/examples/factor_research" || true

      - name: Build optimize-backtest
        run: |
          cargo build --release --locked \
            --target "${PLATFORM_TARGET}" \
            -p ploy-strategy-bundles --example optimize_backtest
          strip "target/${PLATFORM_TARGET}/release/examples/optimize_backtest" || true

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Build deploy bundle
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/bin dist/config/strategies dist/config/deployments dist/migrations dist/deployment/systemd dist/scripts dist/scripts/drills
          cp "target/${PLATFORM_TARGET}/release/new-ployd" dist/bin/ployd
          cp "target/${PLATFORM_TARGET}/release/new-ploy-runner" dist/bin/ploy-runner
          cp "target/${PLATFORM_TARGET}/release/examples/factor_research" dist/bin/factor-research
          cp "target/${PLATFORM_TARGET}/release/examples/optimize_backtest" dist/bin/optimize-backtest
          cp config/strategies/02-pm5d.unified.toml dist/config/strategies/02-pm5d.unified.toml
          cp config/strategies/02-pm5d.live.toml dist/config/strategies/02-pm5d.live.toml
          cp config/strategies/02-pm5d-threelayer.unified.toml dist/config/strategies/02-pm5d-threelayer.unified.toml
          cp config/strategies/02-pm5d-threelayer.live.toml dist/config/strategies/02-pm5d-threelayer.live.toml
          cp config/strategies/02-pm5d-threelayer.obi-soft-dryrun.toml dist/config/strategies/02-pm5d-threelayer.obi-soft-dryrun.toml
          cp config/strategies/02-pm5d-threelayer.obi-hard-dryrun.toml dist/config/strategies/02-pm5d-threelayer.obi-hard-dryrun.toml
          cp config/strategies/02-pm5d-threelayer.champion-dryrun.toml dist/config/strategies/02-pm5d-threelayer.champion-dryrun.toml
          cp config/strategies/02-pm5d-threelayer.continuation-soft-dryrun.toml dist/config/strategies/02-pm5d-threelayer.continuation-soft-dryrun.toml
          cp config/deployments/*.json dist/config/deployments/
          cp scripts/binance_aggtrade_collector.py dist/scripts/binance_aggtrade_collector.py
          cp scripts/binance_price_collector.py dist/scripts/binance_price_collector.py
          cp scripts/binance_lob_collector.py dist/scripts/binance_lob_collector.py
          cp scripts/deribit_atm_greeks_collector.py dist/scripts/deribit_atm_greeks_collector.py
          cp scripts/report_strategy.py dist/scripts/report_strategy.py
          cp scripts/report_market_data_health.py dist/scripts/report_market_data_health.py
          cp scripts/audit_market_data_gaps.py dist/scripts/audit_market_data_gaps.py
          cp scripts/report_dryrun_summary.py dist/scripts/report_dryrun_summary.py
          cp scripts/check_dryrun_report_contract.py dist/scripts/check_dryrun_report_contract.py
          cp scripts/fix_binance_lob_partitions.sql dist/scripts/fix_binance_lob_partitions.sql
          cp scripts/fix_deribit_partitions.sql dist/scripts/fix_deribit_partitions.sql
          cp scripts/fix_clob_trade_partitions.sql dist/scripts/fix_clob_trade_partitions.sql
          cp scripts/repair_strategy_track_record_official_settlement.sql dist/scripts/repair_strategy_track_record_official_settlement.sql
          cp scripts/drills/*.sh dist/scripts/drills/
          for migration in ${DEPLOY_MIGRATIONS}; do
            migration="$(printf '%s' "${migration}" | xargs)"
            [ -n "${migration}" ] || continue
            cp "migrations/${migration}" "dist/migrations/${migration}"
          done
          cp deployment/systemd/ploy-binance-aggtrade-collector.service dist/deployment/systemd/ploy-binance-aggtrade-collector.service
          cp deployment/systemd/ploy-binance-lob-collector.service dist/deployment/systemd/ploy-binance-lob-collector.service
          cp deployment/systemd/ploy-deribit-greeks-collector.service dist/deployment/systemd/ploy-deribit-greeks-collector.service
          cp deployment/systemd/ploy-pm-trade-collector.service dist/deployment/systemd/ploy-pm-trade-collector.service
          cp deployment/systemd/ploy-strategy-directional-dryrun.hardening.conf dist/deployment/systemd/ploy-strategy-directional-dryrun.hardening.conf
          cp deployment/systemd/ploy-quote-collector.hardening.conf dist/deployment/systemd/ploy-quote-collector.hardening.conf
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -C dist -cf - . | gzip -n > "${DEPLOY_BUNDLE_NAME}"
          sha256sum "${DEPLOY_BUNDLE_NAME}" > "${DEPLOY_BUNDLE_NAME}.sha256"

      - name: Validate OSS deploy secrets
        if: ${{ inputs.deploy }}
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          missing=()
          [ -n "${OSS_ACCESS_KEY_ID}" ] || missing+=("ALIYUN_OSS_ACCESS_KEY_ID")
          [ -n "${OSS_ACCESS_KEY_SECRET}" ] || missing+=("ALIYUN_OSS_ACCESS_KEY_SECRET")
          [ -n "${OSS_BUCKET}" ] || missing+=("ALIYUN_OSS_BUCKET")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required OSS deploy secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install ossutil
        if: ${{ inputs.deploy }}
        run: |
          if ! command -v ossutil >/dev/null 2>&1; then
            curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          fi
          export PATH="/usr/local/bin:/usr/bin:/bin:${PATH}"
          command -v ossutil >/dev/null 2>&1

      - name: Upload deploy bundle to OSS
        if: ${{ inputs.deploy }}
        id: upload_bundle_to_oss
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          export PATH="/usr/local/bin:/usr/bin:/bin:${PATH}"
          test -n "${OSS_ACCESS_KEY_ID}"
          test -n "${OSS_ACCESS_KEY_SECRET}"
          test -n "${OSS_BUCKET}"
          export OSS_REGION="${DEPLOY_OSS_REGION}"
          export OSS_ENDPOINT="https://oss-${DEPLOY_OSS_REGION}.aliyuncs.com"
          object_prefix="${DEPLOY_OSS_PREFIX}/${GITHUB_SHA}"
          bundle_object="oss://${OSS_BUCKET}/${object_prefix}/${DEPLOY_BUNDLE_NAME}"
          checksum_object="oss://${OSS_BUCKET}/${object_prefix}/${DEPLOY_BUNDLE_NAME}.sha256"
          ossutil cp "${DEPLOY_BUNDLE_NAME}" "${bundle_object}" \
            -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            -e "https://oss-${DEPLOY_OSS_REGION}.aliyuncs.com"
          ossutil cp "${DEPLOY_BUNDLE_NAME}.sha256" "${checksum_object}" \
            -i "${OSS_ACCESS_KEY_ID}" -k "${OSS_ACCESS_KEY_SECRET}" \
            -e "https://oss-${DEPLOY_OSS_REGION}.aliyuncs.com"
          echo "bundle_object=${bundle_object}" >> "${GITHUB_OUTPUT}"
          echo "checksum_object=${checksum_object}" >> "${GITHUB_OUTPUT}"

      - name: Configure SSH for deploy
        if: ${{ inputs.deploy }}
        env:
          TANGO_1_1_KNOWN_HOSTS: ${{ secrets.TANGO_1_1_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          if [ -z "${TANGO_1_1_KNOWN_HOSTS}" ]; then
            echo "TANGO_1_1_KNOWN_HOSTS secret is required for pinned SSH host verification" >&2
            exit 1
          fi
          printf '%s\n' "${TANGO_1_1_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' '${{ secrets.TANGO_1_1_SSH_KEY }}' > ~/.ssh/tango_1_1_key
          chmod 600 ~/.ssh/tango_1_1_key
          cat > ~/.ssh/config <<EOF
          Host tango-1-1
            HostName ${DEPLOY_HOST}
            User root
            IdentityFile ~/.ssh/tango_1_1_key
            HostKeyAlias tango-1-1
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 20
            ConnectTimeout 30
          EOF

      - name: Prepare remote directories
        if: ${{ inputs.deploy }}
        run: |
          # shellcheck disable=SC2029
          ssh tango-1-1 "mkdir -p ${DEPLOY_ROOT}/bin ${DEPLOY_ROOT}/config/strategies ${DEPLOY_ROOT}/config/deployments ${DEPLOY_ROOT}/migrations ${DEPLOY_ROOT}/scripts ${DEPLOY_ROOT}/scripts/drills ${DEPLOY_ROOT}/tmp"

      - name: Pull bundle from OSS and restart services
        if: ${{ inputs.deploy }}
        run: |
          # shellcheck disable=SC2087
          ssh tango-1-1 /bin/bash <<EOF
            set -euo pipefail
            DEPLOY_STARTED_AT=\$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            WORKDIR=${DEPLOY_ROOT}/tmp/deploy-${GITHUB_SHA}
            rm -rf "\${WORKDIR}"
            mkdir -p "\${WORKDIR}"

            require_postgres() {
              systemctl is-active --quiet postgresql@16-main
              PGPASSWORD=postgres psql -h localhost -U postgres -d ploy -v ON_ERROR_STOP=1 -Atqc "SELECT 1" >/dev/null
            }

            require_service_guardrails() {
              local unit="\$1"
              local restart_policy
              local oom_policy
              local memory_high
              local memory_max

              restart_policy=\$(systemctl show -P Restart "\${unit}")
              oom_policy=\$(systemctl show -P OOMPolicy "\${unit}")
              memory_high=\$(systemctl show -P MemoryHigh "\${unit}")
              memory_max=\$(systemctl show -P MemoryMax "\${unit}")

              test "\${restart_policy}" = "always"
              test "\${oom_policy}" = "kill"
              test "\${memory_high}" != "[not set]"
              test "\${memory_max}" != "[not set]"
            }

            assert_recent_rows() {
              local sql="\$1"
              local message="\$2"
              local result
              result=\$(PGPASSWORD=postgres psql -U postgres -d ploy -Atqc "\${sql}")
              if [ "\${result}" != "t" ]; then
                echo "\${message}" >&2
                exit 1
              fi
            }

            wait_for_recent_rows() {
              local sql="\$1"
              local message="\$2"
              local attempts="\${3:-20}"
              local sleep_secs="\${4:-3}"
              local result

              for _ in \$(seq 1 "\${attempts}"); do
                result=\$(PGPASSWORD=postgres psql -U postgres -d ploy -Atqc "\${sql}")
                if [ "\${result}" = "t" ]; then
                  return 0
                fi
                sleep "\${sleep_secs}"
              done

              echo "\${message}" >&2
              exit 1
            }

            assert_no_recent_logs() {
              local unit="\$1"
              local pattern="\$2"
              local message="\$3"
              local since="\${DEPLOY_VERIFY_SINCE:-\${DEPLOY_STARTED_AT}}"
              if journalctl -u "\${unit}" --since "\${since}" --no-pager | grep -E "\${pattern}"; then
                echo "\${message}" >&2
                exit 1
              fi
            }

            service_exists() {
              systemctl cat "\$1" >/dev/null 2>&1
            }

            ensure_ossutil() {
              export PATH="/usr/local/bin:/usr/bin:/bin:\${PATH}"
              if command -v ossutil >/dev/null 2>&1; then
                return 0
              fi
              curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | bash
              export PATH="/usr/local/bin:/usr/bin:/bin:\${PATH}"
              command -v ossutil >/dev/null 2>&1
            }

            ensure_ossutil

            export OSS_ACCESS_KEY_ID='${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}'
            export OSS_ACCESS_KEY_SECRET='${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}'
            export OSS_REGION='${DEPLOY_OSS_REGION}'
            export OSS_ENDPOINT="https://oss-${DEPLOY_OSS_REGION}-internal.aliyuncs.com"
            OSS_BUCKET='${{ secrets.ALIYUN_OSS_BUCKET }}'
            OSS_OBJECT_PREFIX='${DEPLOY_OSS_PREFIX}/${GITHUB_SHA}'

            test -n "\${OSS_ACCESS_KEY_ID}"
            test -n "\${OSS_ACCESS_KEY_SECRET}"
            test -n "\${OSS_BUCKET}"

            ossutil cp "oss://\${OSS_BUCKET}/\${OSS_OBJECT_PREFIX}/${DEPLOY_BUNDLE_NAME}" "\${WORKDIR}/${DEPLOY_BUNDLE_NAME}" \
              -i "\${OSS_ACCESS_KEY_ID}" -k "\${OSS_ACCESS_KEY_SECRET}" \
              -e "\${OSS_ENDPOINT}"
            ossutil cp "oss://\${OSS_BUCKET}/\${OSS_OBJECT_PREFIX}/${DEPLOY_BUNDLE_NAME}.sha256" "\${WORKDIR}/${DEPLOY_BUNDLE_NAME}.sha256" \
              -i "\${OSS_ACCESS_KEY_ID}" -k "\${OSS_ACCESS_KEY_SECRET}" \
              -e "\${OSS_ENDPOINT}"

            cd "\${WORKDIR}"
            sha256sum -c "${DEPLOY_BUNDLE_NAME}.sha256"
            tar -xzf "${DEPLOY_BUNDLE_NAME}"

            # Install artifacts into the live runtime root used by systemd.
            install -m 0755 ./bin/ployd ${DEPLOY_ROOT}/bin/ployd
            install -m 0755 ./bin/ploy-runner ${DEPLOY_ROOT}/bin/ploy-runner
            install -m 0755 ./bin/factor-research ${DEPLOY_ROOT}/bin/factor-research
            install -m 0755 ./bin/optimize-backtest ${DEPLOY_ROOT}/bin/optimize-backtest
            install -m 0644 ./config/strategies/02-pm5d.unified.toml ${DEPLOY_ROOT}/config/strategies/02-pm5d.unified.toml
            install -m 0644 ./config/strategies/02-pm5d.live.toml ${DEPLOY_ROOT}/config/strategies/02-pm5d.live.toml
            install -m 0644 ./config/strategies/02-pm5d-threelayer.unified.toml ${DEPLOY_ROOT}/config/strategies/02-pm5d-threelayer.unified.toml
            install -m 0644 ./config/strategies/02-pm5d-threelayer.live.toml ${DEPLOY_ROOT}/config/strategies/02-pm5d-threelayer.live.toml
            install -m 0644 ./config/strategies/02-pm5d-threelayer.obi-soft-dryrun.toml ${DEPLOY_ROOT}/config/strategies/02-pm5d-threelayer.obi-soft-dryrun.toml
            install -m 0644 ./config/strategies/02-pm5d-threelayer.obi-hard-dryrun.toml ${DEPLOY_ROOT}/config/strategies/02-pm5d-threelayer.obi-hard-dryrun.toml
            install -m 0644 ./config/strategies/02-pm5d-threelayer.champion-dryrun.toml ${DEPLOY_ROOT}/config/strategies/02-pm5d-threelayer.champion-dryrun.toml
            install -m 0644 ./config/strategies/02-pm5d-threelayer.continuation-soft-dryrun.toml ${DEPLOY_ROOT}/config/strategies/02-pm5d-threelayer.continuation-soft-dryrun.toml
            install -m 0644 ./config/deployments/*.json ${DEPLOY_ROOT}/config/deployments/
            install -m 0755 ./scripts/binance_aggtrade_collector.py ${DEPLOY_ROOT}/scripts/binance_aggtrade_collector.py
            install -m 0755 ./scripts/binance_price_collector.py ${DEPLOY_ROOT}/scripts/binance_price_collector.py
            install -m 0755 ./scripts/binance_lob_collector.py ${DEPLOY_ROOT}/scripts/binance_lob_collector.py
            install -m 0755 ./scripts/deribit_atm_greeks_collector.py ${DEPLOY_ROOT}/scripts/deribit_atm_greeks_collector.py
            install -m 0755 ./scripts/report_strategy.py ${DEPLOY_ROOT}/scripts/report_strategy.py
            install -m 0755 ./scripts/report_market_data_health.py ${DEPLOY_ROOT}/scripts/report_market_data_health.py
            install -m 0755 ./scripts/audit_market_data_gaps.py ${DEPLOY_ROOT}/scripts/audit_market_data_gaps.py
            install -m 0755 ./scripts/report_dryrun_summary.py ${DEPLOY_ROOT}/scripts/report_dryrun_summary.py
            install -m 0755 ./scripts/check_dryrun_report_contract.py ${DEPLOY_ROOT}/scripts/check_dryrun_report_contract.py
            install -m 0644 ./scripts/fix_binance_lob_partitions.sql ${DEPLOY_ROOT}/scripts/fix_binance_lob_partitions.sql
            install -m 0644 ./scripts/fix_deribit_partitions.sql ${DEPLOY_ROOT}/scripts/fix_deribit_partitions.sql
            install -m 0644 ./scripts/fix_clob_trade_partitions.sql ${DEPLOY_ROOT}/scripts/fix_clob_trade_partitions.sql
            install -m 0644 ./scripts/repair_strategy_track_record_official_settlement.sql ${DEPLOY_ROOT}/scripts/repair_strategy_track_record_official_settlement.sql
            install -m 0755 ./scripts/drills/*.sh ${DEPLOY_ROOT}/scripts/drills/
            for migration in ${DEPLOY_MIGRATIONS}; do
              migration="$(printf '%s' "\${migration}" | xargs)"
              [ -n "\${migration}" ] || continue
              install -m 0644 "./migrations/\${migration}" "${DEPLOY_ROOT}/migrations/\${migration}"
            done

            install -d /etc/systemd/system/ploy-quote-collector.service.d
            install -m 0644 ./deployment/systemd/ploy-binance-aggtrade-collector.service /etc/systemd/system/ploy-binance-aggtrade-collector.service
            install -m 0644 ./deployment/systemd/ploy-binance-lob-collector.service /etc/systemd/system/ploy-binance-lob-collector.service
            install -m 0644 ./deployment/systemd/ploy-deribit-greeks-collector.service /etc/systemd/system/ploy-deribit-greeks-collector.service
            install -m 0644 ./deployment/systemd/ploy-pm-trade-collector.service /etc/systemd/system/ploy-pm-trade-collector.service
            install -m 0644 ./deployment/systemd/ploy-quote-collector.hardening.conf /etc/systemd/system/ploy-quote-collector.service.d/hardening.conf
            systemctl daemon-reload

            # Apply additive runner migrations before restarting services.
            mkdir -p ${DEPLOY_ROOT}/migrations
            for migration in ${DEPLOY_MIGRATIONS}; do
              migration="$(printf '%s' "\${migration}" | xargs)"
              [ -n "\${migration}" ] || continue
              migration="${DEPLOY_ROOT}/migrations/\${migration}"
              if [ -f "\${migration}" ]; then
                PGPASSWORD=postgres psql -U postgres -d ploy -v ON_ERROR_STOP=1 -f "\${migration}"
              fi
            done
            PGPASSWORD=postgres psql -U postgres -d ploy -v ON_ERROR_STOP=1 -f ${DEPLOY_ROOT}/scripts/fix_binance_lob_partitions.sql
            PGPASSWORD=postgres psql -U postgres -d ploy -v ON_ERROR_STOP=1 -f ${DEPLOY_ROOT}/scripts/fix_deribit_partitions.sql
            PGPASSWORD=postgres psql -U postgres -d ploy -v ON_ERROR_STOP=1 -f ${DEPLOY_ROOT}/scripts/fix_clob_trade_partitions.sql

            require_postgres

            systemctl enable --now ploy-binance-aggtrade-collector.service
            systemctl restart ploy-binance-aggtrade-collector.service
            systemctl enable --now ploy-binance-lob-collector.service
            systemctl restart ploy-binance-lob-collector.service
            if service_exists ploy-binance-price-collector.service; then
              systemctl restart ploy-binance-price-collector.service
            fi
            if service_exists ploy-deribit-iv-collector.service; then
              systemctl restart ploy-deribit-iv-collector.service
            fi
            systemctl enable --now ploy-deribit-greeks-collector.service
            systemctl restart ploy-deribit-greeks-collector.service
            if service_exists ploy-quote-collector.service; then
              systemctl enable --now ploy-quote-collector.service
              systemctl restart ploy-quote-collector.service
            fi
            systemctl enable --now ploy-pm-trade-collector.service
            systemctl restart ploy-pm-trade-collector.service
            if service_exists ployd.service; then
              systemctl restart ployd.service
            fi

            DEPLOY_VERIFY_SINCE=\$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            sleep 5
            require_postgres
            systemctl is-active --quiet ploy-binance-aggtrade-collector.service
            systemctl is-active --quiet ploy-binance-lob-collector.service
            require_service_guardrails ploy-binance-lob-collector.service
            if service_exists ploy-quote-collector.service; then
              systemctl is-active --quiet ploy-quote-collector.service
              require_service_guardrails ploy-quote-collector.service
            fi
            systemctl is-active --quiet ploy-pm-trade-collector.service
            require_service_guardrails ploy-pm-trade-collector.service
            if service_exists ploy-binance-price-collector.service; then
              systemctl is-active --quiet ploy-binance-price-collector.service
            fi
            if service_exists ploy-deribit-iv-collector.service; then
              systemctl is-active --quiet ploy-deribit-iv-collector.service
            fi
            systemctl is-active --quiet ploy-deribit-greeks-collector.service
            require_service_guardrails ploy-deribit-greeks-collector.service
            if service_exists ployd.service; then
              systemctl is-active --quiet ployd.service
              curl -fsS http://127.0.0.1:8081/health
              curl -fsS http://127.0.0.1:8081/api/reports/dry-run | ${DEPLOY_ROOT}/scripts/check_dryrun_report_contract.py
              ${DEPLOY_ROOT}/bin/ployctl deployments list
            fi

            wait_for_recent_rows \
              "SELECT EXISTS (SELECT 1 FROM binance_agg_trade_ticks WHERE trade_time >= NOW() - INTERVAL '10 minutes')" \
              "binance_agg_trade_ticks is not fresh after deploy" \
              20 \
              3
            wait_for_recent_rows \
              "SELECT EXISTS (SELECT 1 FROM binance_lob_ticks WHERE event_time >= NOW() - INTERVAL '10 minutes')" \
              "binance_lob_ticks is not fresh after deploy" \
              20 \
              3
            if service_exists ploy-binance-price-collector.service; then
              wait_for_recent_rows \
                "SELECT EXISTS (SELECT 1 FROM binance_price_ticks WHERE trade_time >= NOW() - INTERVAL '10 minutes')" \
                "binance_price_ticks is not fresh after deploy" \
                20 \
                3
            fi
            if service_exists ploy-deribit-iv-collector.service; then
              wait_for_recent_rows \
                "SELECT EXISTS (SELECT 1 FROM deribit_iv_ticks WHERE fetched_at >= NOW() - INTERVAL '15 minutes')" \
                "deribit_iv_ticks is not fresh after deploy" \
                20 \
                3
            fi
            wait_for_recent_rows \
              "SELECT EXISTS (SELECT 1 FROM deribit_atm_greeks_ticks WHERE fetched_at >= NOW() - INTERVAL '15 minutes')" \
              "deribit_atm_greeks_ticks is not fresh after deploy" \
              20 \
              3
            wait_for_recent_rows \
              "SELECT EXISTS (SELECT 1 FROM clob_trade_ticks WHERE received_at >= NOW() - INTERVAL '5 minutes')" \
              "clob_trade_ticks is not receiving PM trade prints after deploy" \
              20 \
              3

            if service_exists ployd.service; then
              assert_no_recent_logs \
                "ployd.service" \
                "DB connection failed|running without persistence|Signal recorder disabled" \
                "ployd restarted in degraded persistence mode"
            fi
            if service_exists ploy-binance-price-collector.service; then
              assert_no_recent_logs \
                "ploy-binance-price-collector.service" \
                "uq_binance_price_ticks_symbol_second|duplicate key value" \
                "binance price collector is still thrashing on duplicate writes"
            fi
            if service_exists ploy-deribit-iv-collector.service; then
              assert_no_recent_logs \
                "ploy-deribit-iv-collector.service" \
                "no partition of relation \"deribit_iv_ticks\"" \
                "deribit iv collector still lacks active partitions"
            fi
            assert_no_recent_logs \
              "ploy-deribit-greeks-collector.service" \
              "Traceback|psql failed|column \"option_type\" does not exist|column \"strike\" does not exist" \
              "deribit greeks collector failed after deploy"
            assert_no_recent_logs \
              "ploy-pm-trade-collector.service" \
              "no partition of relation \"clob_trade_ticks\"" \
              "pm trade collector still lacks active partitions"

            # Check service status
            systemctl status ploy-binance-aggtrade-collector.service --no-pager
            if service_exists ploy-binance-price-collector.service; then
              systemctl status ploy-binance-price-collector.service --no-pager
            fi
            systemctl status ploy-binance-lob-collector.service --no-pager
            if service_exists ploy-deribit-iv-collector.service; then
              systemctl status ploy-deribit-iv-collector.service --no-pager
            fi
            systemctl status ploy-deribit-greeks-collector.service --no-pager
            if service_exists ployd.service; then
              systemctl status ployd.service --no-pager
            fi
            if service_exists ploy-quote-collector.service; then
              systemctl status ploy-quote-collector.service --no-pager
            fi
            systemctl status ploy-pm-trade-collector.service --no-pager

            # Show recent logs
            journalctl -u ploy-binance-aggtrade-collector.service -n 20 --no-pager
            if service_exists ploy-binance-price-collector.service; then
              journalctl -u ploy-binance-price-collector.service -n 20 --no-pager
            fi
            journalctl -u ploy-binance-lob-collector.service -n 20 --no-pager
            if service_exists ploy-deribit-iv-collector.service; then
              journalctl -u ploy-deribit-iv-collector.service -n 20 --no-pager
            fi
            journalctl -u ploy-deribit-greeks-collector.service -n 20 --no-pager
            if service_exists ployd.service; then
              journalctl -u ployd.service -n 20 --no-pager
            fi
            if service_exists ploy-quote-collector.service; then
              journalctl -u ploy-quote-collector.service -n 20 --no-pager
            fi
            journalctl -u ploy-pm-trade-collector.service -n 20 --no-pager
          EOF

      - name: Deployment summary
        if: ${{ inputs.deploy }}
        run: |
          {
            echo "## Deployment to tango-1-1"
            echo "- Binary: \`ploy-runner\`"
            echo "- Target: \`${{ secrets.TANGO_1_1_HOST }}\`"
            echo "- Transport: \`GitHub Actions -> OSS -> ECS\`"
            echo "- OSS object: \`${{ steps.upload_bundle_to_oss.outputs.bundle_object }}\`"
            echo "- Services: \`ployd\` (if installed), \`ploy-binance-aggtrade-collector\`, \`ploy-binance-price-collector\`, \`ploy-binance-lob-collector\`, \`ploy-deribit-iv-collector\`, \`ploy-quote-collector\`, \`ploy-pm-trade-collector\`"
            echo "- Git ref: \`${{ github.event.inputs.git_ref }}\`"
            echo "- Migrations: \`${DEPLOY_MIGRATIONS}\`"
            echo "- Postgres pre/postflight: required"
            echo "- Persistence guardrail: deployment fails if dry-run starts without DB-backed recorder"
          } >> "$GITHUB_STEP_SUMMARY"
