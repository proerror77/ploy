name: Deploy to tango-1-1

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: true
        default: "main"

concurrency:
  group: deploy-tango-1-1-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PLATFORM_TARGET: x86_64-unknown-linux-gnu
  DEPLOY_HOST: ${{ secrets.TANGO_1_1_HOST }}
  DEPLOY_RELEASE_TAG: deploy-tango-1-1-latest
  DEPLOY_BUNDLE_NAME: ploy-runner-tango-1-1.tar.gz

jobs:
  build-and-deploy:
    name: Build and deploy to tango-1-1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: tango-1-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.PLATFORM_TARGET }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld openssh-client

      - name: Build ploy-runner
        run: |
          cargo clean -p ploy-runner
          cargo build --release --locked \
            --target "${PLATFORM_TARGET}" \
            -p ploy-runner
          strip "target/${PLATFORM_TARGET}/release/ploy-runner" || true

      - name: Build deploy bundle
        run: |
          rm -rf dist
          mkdir -p dist/bin dist/config/strategies dist/migrations
          cp target/${PLATFORM_TARGET}/release/ploy-runner dist/bin/ploy-runner
          cp config/strategies/02-pm5d.unified.toml dist/config/strategies/02-pm5d.unified.toml
          cp migrations/027_reference_price_ticks.sql dist/migrations/027_reference_price_ticks.sql
          cp migrations/028_pm_market_catalog.sql dist/migrations/028_pm_market_catalog.sql
          cp migrations/029_sports_state_events.sql dist/migrations/029_sports_state_events.sql
          tar -C dist -czf "${DEPLOY_BUNDLE_NAME}" .
          sha256sum "${DEPLOY_BUNDLE_NAME}" > "${DEPLOY_BUNDLE_NAME}.sha256"

      - name: Publish deploy bundle to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${DEPLOY_RELEASE_TAG}" --yes --cleanup-tag || true
          gh release create "${DEPLOY_RELEASE_TAG}" \
            "${DEPLOY_BUNDLE_NAME}#${DEPLOY_BUNDLE_NAME}" \
            "${DEPLOY_BUNDLE_NAME}.sha256#${DEPLOY_BUNDLE_NAME}.sha256" \
            --target "${GITHUB_SHA}" \
            --title "Deploy bundle for tango-1-1" \
            --notes "Deploy bundle for ${GITHUB_SHA}" \
            --prerelease

      - name: Resolve deploy asset ids
        id: resolve_deploy_asset_ids
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${DEPLOY_RELEASE_TAG}")
          bundle_asset_id=$(jq -r '.assets[] | select(.name == "'"${DEPLOY_BUNDLE_NAME}"'") | .id' <<<"${release_json}")
          checksum_asset_id=$(jq -r '.assets[] | select(.name == "'"${DEPLOY_BUNDLE_NAME}.sha256"'") | .id' <<<"${release_json}")
          test -n "${bundle_asset_id}" && test "${bundle_asset_id}" != "null"
          test -n "${checksum_asset_id}" && test "${checksum_asset_id}" != "null"
          echo "bundle_asset_id=${bundle_asset_id}" >> "${GITHUB_OUTPUT}"
          echo "checksum_asset_id=${checksum_asset_id}" >> "${GITHUB_OUTPUT}"

      - name: Configure SSH for deploy
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.TANGO_1_1_SSH_KEY }}' > ~/.ssh/tango_1_1_key
          chmod 600 ~/.ssh/tango_1_1_key
          cat > ~/.ssh/config <<EOF
          Host tango-1-1
            HostName ${DEPLOY_HOST}
            User root
            IdentityFile ~/.ssh/tango_1_1_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 20
            ConnectTimeout 30
          EOF

      - name: Prepare remote directories
        run: |
          ssh tango-1-1 'mkdir -p /root/ploy/bin /root/ploy/config/strategies /root/ploy/migrations /root/ploy/tmp'

      - name: Pull bundle from GitHub and restart services
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ssh tango-1-1 /bin/bash <<EOF
            set -euo pipefail
            WORKDIR=/root/ploy/tmp/deploy-${GITHUB_SHA}
            rm -rf "\${WORKDIR}"
            mkdir -p "\${WORKDIR}"

            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${{ steps.resolve_deploy_asset_ids.outputs.bundle_asset_id }}" \
              -o "\${WORKDIR}/${DEPLOY_BUNDLE_NAME}"

            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${{ steps.resolve_deploy_asset_ids.outputs.checksum_asset_id }}" \
              -o "\${WORKDIR}/${DEPLOY_BUNDLE_NAME}.sha256"

            cd "\${WORKDIR}"
            sha256sum -c "${DEPLOY_BUNDLE_NAME}.sha256"
            tar -xzf "${DEPLOY_BUNDLE_NAME}"

            # Make binary executable
            install -m 0755 ./bin/ploy-runner /root/ploy/bin/ploy-runner
            install -m 0644 ./config/strategies/02-pm5d.unified.toml /root/ploy/config/strategies/02-pm5d.unified.toml
            install -m 0644 ./migrations/027_reference_price_ticks.sql /root/ploy/migrations/027_reference_price_ticks.sql
            install -m 0644 ./migrations/028_pm_market_catalog.sql /root/ploy/migrations/028_pm_market_catalog.sql
            install -m 0644 ./migrations/029_sports_state_events.sql /root/ploy/migrations/029_sports_state_events.sql

            # Apply additive runner migrations before restarting services.
            mkdir -p /root/ploy/migrations
            for migration in \
              /root/ploy/migrations/027_reference_price_ticks.sql \
              /root/ploy/migrations/028_pm_market_catalog.sql \
              /root/ploy/migrations/029_sports_state_events.sql; do
              if [ -f "${migration}" ]; then
                PGPASSWORD=postgres psql -U postgres -d ploy -v ON_ERROR_STOP=1 -f "${migration}"
              fi
            done

            systemctl restart ploy-strategy-directional-dryrun || echo "Service not running: ploy-strategy-directional-dryrun"
            systemctl restart ploy-quote-collector || echo "Service not running: ploy-quote-collector"

            # Check service status
            sleep 2
            systemctl status ploy-strategy-directional-dryrun --no-pager || true
            systemctl status ploy-quote-collector --no-pager || true

            # Show recent logs
            journalctl -u ploy-strategy-directional-dryrun -n 20 --no-pager
            journalctl -u ploy-quote-collector -n 20 --no-pager
          EOF

      - name: Deployment summary
        run: |
          echo "## Deployment to tango-1-1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Binary: \`ploy-runner\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${{ secrets.TANGO_1_1_HOST }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Services: \`ploy-strategy-directional-dryrun\`, \`ploy-quote-collector\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git ref: \`${{ github.event.inputs.git_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
