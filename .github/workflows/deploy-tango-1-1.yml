name: Deploy to tango-1-1

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: true
        default: "main"

concurrency:
  group: deploy-tango-1-1-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PLATFORM_TARGET: x86_64-unknown-linux-gnu

jobs:
  build-and-deploy:
    name: Build and deploy to tango-1-1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: tango-1-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.PLATFORM_TARGET }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld

      - name: Build ploy-runner
        run: |
          cargo build --release --locked \
            --target "${PLATFORM_TARGET}" \
            -p ploy-runner
          strip "target/${PLATFORM_TARGET}/release/ploy-runner" || true

      - name: Upload binary to tango-1-1
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TANGO_1_1_HOST }}
          username: root
          key: ${{ secrets.TANGO_1_1_SSH_KEY }}
          source: target/${{ env.PLATFORM_TARGET }}/release/ploy-runner
          target: /root/ploy/bin/
          strip_components: 4

      - name: Restart ploy-runner services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TANGO_1_1_HOST }}
          username: root
          key: ${{ secrets.TANGO_1_1_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            # Make binary executable
            chmod +x /root/ploy/bin/ploy-runner

            # Restart directional strategy service
            systemctl restart ploy-strategy-directional-dryrun || echo "Service not running"

            # Check service status
            sleep 2
            systemctl status ploy-strategy-directional-dryrun --no-pager || true

            # Show recent logs
            journalctl -u ploy-strategy-directional-dryrun -n 20 --no-pager

      - name: Deployment summary
        run: |
          echo "## Deployment to tango-1-1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Binary: \`ploy-runner\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${{ secrets.TANGO_1_1_HOST }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: \`ploy-strategy-directional-dryrun\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git ref: \`${{ github.event.inputs.git_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
