name: Recorded Replay Dry-run Parity

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "Dry-run deployment id to replay and compare"
        required: true
        default: "pm5d.threelayer.obi-soft.dryrun"
      config_path:
        description: "Remote deployed dry-run config path on tango-1-1"
        required: true
        default: "/opt/ploy/config/strategies/02-pm5d-threelayer.obi-soft-dryrun.toml"
      recording_path:
        description: "Remote recorded MarketUpdate NDJSON path on tango-1-1"
        required: true
        default: "/opt/ploy/data/recordings/pm5d-threelayer-canonical.ndjson"
      since:
        description: "Inclusive ISO-8601 lower timestamp bound for parity rows, or auto"
        required: false
        default: "auto"
      until:
        description: "Inclusive ISO-8601 upper timestamp bound for parity rows, or auto"
        required: false
        default: "auto"
      issue_number:
        description: "Optional GitHub issue number for posting parity evidence"
        required: false
        default: "321"

concurrency:
  group: recorded-replay-parity-${{ github.event.inputs.deployment_id }}-${{ github.event.inputs.since }}-${{ github.event.inputs.until }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  DEPLOY_HOST: ${{ secrets.TANGO_1_1_HOST }}

jobs:
  parity:
    name: Replay recorded feed and compare dry-run evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: tango-1-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          TANGO_1_1_KNOWN_HOSTS: ${{ secrets.TANGO_1_1_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          if [ -z "${TANGO_1_1_KNOWN_HOSTS}" ]; then
            echo "TANGO_1_1_KNOWN_HOSTS secret is required for pinned SSH host verification" >&2
            exit 1
          fi
          printf '%s\n' "${TANGO_1_1_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' '${{ secrets.TANGO_1_1_SSH_KEY }}' > ~/.ssh/tango_1_1_key
          chmod 600 ~/.ssh/tango_1_1_key
          cat > ~/.ssh/config <<EOF
          Host tango-1-1
            HostName ${DEPLOY_HOST}
            User root
            IdentityFile ~/.ssh/tango_1_1_key
            HostKeyAlias tango-1-1
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 20
            ConnectTimeout 30
          EOF

      - name: Run recorded replay on tango-1-1
        env:
          DEPLOYMENT_ID: ${{ github.event.inputs.deployment_id }}
          CONFIG_PATH: ${{ github.event.inputs.config_path }}
          RECORDING_PATH: ${{ github.event.inputs.recording_path }}
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
          REMOTE_DIR: /opt/ploy/tmp/recorded-replay-parity-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/replay artifacts/dryrun artifacts/parity

          ssh tango-1-1 /bin/bash -s -- "${REMOTE_DIR}" <<'EOF'
          set -euo pipefail
          mkdir -p "$1"
          EOF
          scp scripts/enrich_recording_official_settlement.py \
            tango-1-1:"${REMOTE_DIR}/enrich_recording_official_settlement.py"
          scp scripts/enrich_replay_runtime_evidence.py \
            tango-1-1:"${REMOTE_DIR}/enrich_replay_runtime_evidence.py"
          scp scripts/extract_dryrun_settlement_evidence.py \
            tango-1-1:"${REMOTE_DIR}/extract_dryrun_settlement_evidence.py"
          scp scripts/replay_dryrun_parity.py \
            tango-1-1:"${REMOTE_DIR}/replay_dryrun_parity.py"
          scp scripts/resolve_recorded_replay_window.py \
            tango-1-1:"${REMOTE_DIR}/resolve_recorded_replay_window.py"

          # shellcheck disable=SC2029
          ssh tango-1-1 /bin/bash -s -- \
            "${DEPLOYMENT_ID}" \
            "${CONFIG_PATH}" \
            "${RECORDING_PATH}" \
            "${REMOTE_DIR}" \
            "${SINCE}" \
            "${UNTIL}" <<'EOF'
          set -euo pipefail
          deployment_id="$1"
          config_path="$2"
          recording_path="$3"
          remote_dir="$4"
          since_ts="$5"
          until_ts="$6"

          mkdir -p "${remote_dir}"
          test -x /opt/ploy/bin/ploy-runner
          test -r "${config_path}"
          test -r "${recording_path}"
          test -r "${remote_dir}/enrich_recording_official_settlement.py"
          test -r "${remote_dir}/enrich_replay_runtime_evidence.py"
          test -r "${remote_dir}/extract_dryrun_settlement_evidence.py"
          test -r "${remote_dir}/replay_dryrun_parity.py"
          test -r "${remote_dir}/resolve_recorded_replay_window.py"

          set -a
          . /opt/ploy/.env
          set +a

          requested_since_ts="${since_ts}"
          requested_until_ts="${until_ts}"
          auto_window=false
          case "${since_ts}" in ""|auto|AUTO) auto_window=true ;; esac
          case "${until_ts}" in ""|auto|AUTO) auto_window=true ;; esac

          settlements_json="${remote_dir}/official-settlements.json"
          dryrun_report="${remote_dir}/dryrun-report.json"
          enriched_recording="${remote_dir}/recording-official-settlement.ndjson"
          enrichment_report="${remote_dir}/recording-enrichment.json"
          resolved_window_json="${remote_dir}/resolved-window.json"
          resolved_window_env="${remote_dir}/resolved-window.env"
          curl -fsS http://127.0.0.1:8081/api/reports/dry-run \
            -o "${dryrun_report}"
          if [ -n "${PLOY_DATABASE__URL:-}" ]; then
            PSQL=(psql "${PLOY_DATABASE__URL}" -v ON_ERROR_STOP=1 -t -A)
          else
            PSQL=(env PGPASSWORD=postgres psql -U postgres -d ploy -v ON_ERROR_STOP=1 -t -A)
          fi

          if [ "${auto_window}" = true ]; then
            python3 "${remote_dir}/resolve_recorded_replay_window.py" \
              --recording "${recording_path}" \
              --dryrun-json "${dryrun_report}" \
              --deployment-id "${deployment_id}" \
              --output-json "${resolved_window_json}" \
              --output-env "${resolved_window_env}"
            # shellcheck disable=SC1090
            . "${resolved_window_env}"
            since_ts="${RESOLVED_SINCE}"
            until_ts="${RESOLVED_UNTIL}"
          else
            cat > "${resolved_window_env}" <<EOF_WINDOW
          RESOLVED_SINCE=${since_ts}
          RESOLVED_UNTIL=${until_ts}
          RESOLVED_WINDOW_MODE=manual
          RESOLVED_CLOSED_ROW_COUNT=
          EOF_WINDOW
            python3 - "${resolved_window_env}" "${resolved_window_json}" <<'PY'
          import json
          import sys

          env_path, json_path = sys.argv[1:]
          values = {}
          for raw in open(env_path, encoding="utf-8"):
              key, _, value = raw.rstrip("\n").partition("=")
              values[key] = value
          with open(json_path, "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "mode": values.get("RESOLVED_WINDOW_MODE"),
                      "closed_row_count": None,
                      "since": values.get("RESOLVED_SINCE"),
                      "until": values.get("RESOLVED_UNTIL"),
                  },
                  handle,
                  indent=2,
                  sort_keys=True,
              )
              handle.write("\n")
          PY
          fi
          echo "Recorded replay parity window: ${since_ts} -> ${until_ts} (requested ${requested_since_ts} -> ${requested_until_ts})"

          "${PSQL[@]}" \
            -v deployment_id="${deployment_id}" \
            -v since_ts="${since_ts}" \
            -v until_ts="${until_ts}" \
            > "${settlements_json}" <<'SQL'
          WITH row_outcomes AS (
            SELECT
              event_id,
              token_id,
              avg_exit_price::text AS settlement,
              CASE
                WHEN market_side = 'UP' AND avg_exit_price >= 0.99 THEN 1
                WHEN market_side = 'UP' AND avg_exit_price <= 0.01 THEN 0
                WHEN market_side = 'DOWN' AND avg_exit_price >= 0.99 THEN 0
                WHEN market_side = 'DOWN' AND avg_exit_price <= 0.01 THEN 1
                ELSE NULL
              END AS outcome_int
            FROM strategy_runtime_event_track_record
            WHERE runtime_mode IN ('dry_run', 'dryrun')
              AND deployment_id = :'deployment_id'
              AND is_closed
              AND opened_at >= :'since_ts'::timestamptz - INTERVAL '10 minutes'
              AND opened_at <= :'until_ts'::timestamptz + INTERVAL '10 minutes'
          ),
          unambiguous AS (
            SELECT
              event_id,
              token_id,
              MIN(outcome_int) AS outcome_int,
              MIN(settlement) AS settlement
            FROM row_outcomes
            WHERE event_id IS NOT NULL
              AND token_id IS NOT NULL
              AND outcome_int IS NOT NULL
              AND settlement IS NOT NULL
            GROUP BY event_id, token_id
            HAVING MIN(outcome_int) = MAX(outcome_int)
          )
          SELECT COALESCE(
            jsonb_agg(
              jsonb_build_object(
                'event_id', event_id,
                'token_id', token_id,
                'settlement', settlement,
                'resolved_up_won', outcome_int = 1
              )
              ORDER BY event_id, token_id
            ),
            '[]'::jsonb
          )::text
          FROM unambiguous;
          SQL

          python3 "${remote_dir}/extract_dryrun_settlement_evidence.py" \
            --dryrun-json "${dryrun_report}" \
            --output-json "${settlements_json}" \
            --deployment-id "${deployment_id}" \
            --since "${since_ts}" \
            --until "${until_ts}"

          python3 "${remote_dir}/enrich_recording_official_settlement.py" \
            --input "${recording_path}" \
            --output "${enriched_recording}" \
            --settlements-json "${settlements_json}" \
            --report-json "${enrichment_report}"
          test -s "${enriched_recording}"

          replay_config="${remote_dir}/replay.toml"
          python3 - "${config_path}" "${enriched_recording}" "${replay_config}" <<'PY'
          import sys
          src, recording, dst = sys.argv[1:]
          lines = []
          inserted_replay_path = False
          with open(src, encoding="utf-8") as handle:
              for raw in handle.read().splitlines():
                  stripped = raw.strip()
                  if stripped.startswith("mode = "):
                      lines.append('mode = "replay"')
                      lines.append("skip_settlement_exits = true")
                      lines.append(f'replay_market_updates_from = "{recording}"')
                      inserted_replay_path = True
                      continue
                  if stripped.startswith("skip_settlement_exits"):
                      continue
                  if stripped.startswith("record_market_updates_to"):
                      continue
                  if stripped.startswith("record_market_updates_max_"):
                      continue
                  lines.append(raw)
          if not inserted_replay_path:
              raise SystemExit("runtime mode line not found in source config")
          with open(dst, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

          timeout 600 /opt/ploy/bin/ploy-runner run \
            --config "${replay_config}" \
            --deployment-id "${deployment_id}" \
            --output-json "${remote_dir}/replay-evaluation.json"

          python3 "${remote_dir}/enrich_replay_runtime_evidence.py" \
            --input-json "${remote_dir}/replay-evaluation.json" \
            --output-json "${remote_dir}/replay-evaluation.json" \
            --settlements-json "${settlements_json}" \
            --report-json "${remote_dir}/replay-evidence-enrichment.json"

          test -s "${remote_dir}/replay-evaluation.json"
          test -s "${remote_dir}/dryrun-report.json"
          ls -lh "${remote_dir}/replay-evaluation.json" "${remote_dir}/dryrun-report.json" "${enrichment_report}" "${remote_dir}/replay-evidence-enrichment.json"
          EOF

          scp tango-1-1:"${REMOTE_DIR}/replay-evaluation.json" artifacts/replay/evaluation.json
          scp tango-1-1:"${REMOTE_DIR}/recording-enrichment.json" artifacts/replay/recording-enrichment.json
          scp tango-1-1:"${REMOTE_DIR}/replay-evidence-enrichment.json" artifacts/replay/replay-evidence-enrichment.json
          scp tango-1-1:"${REMOTE_DIR}/dryrun-report.json" artifacts/dryrun/dryrun.json
          scp tango-1-1:"${REMOTE_DIR}/resolved-window.json" artifacts/parity/resolved-window.json
          scp tango-1-1:"${REMOTE_DIR}/resolved-window.env" artifacts/parity/resolved-window.env

      - name: Compare replay and dry-run evidence
        env:
          DEPLOYMENT_ID: ${{ github.event.inputs.deployment_id }}
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
        run: |
          set -euo pipefail
          if [ -f artifacts/parity/resolved-window.env ]; then
            # shellcheck disable=SC1091
            . artifacts/parity/resolved-window.env
            SINCE="${RESOLVED_SINCE}"
            UNTIL="${RESOLVED_UNTIL}"
          fi
          python3 scripts/replay_dryrun_parity.py \
            --replay-json artifacts/replay/evaluation.json \
            --dryrun-json artifacts/dryrun/dryrun.json \
            --output-json artifacts/parity/parity-evaluation.json \
            --deployment-id "${DEPLOYMENT_ID}" \
            --since "${SINCE}" \
            --until "${UNTIL}"

      - name: Publish parity summary
        if: always()
        run: |
          resolved_since="${{ github.event.inputs.since }}"
          resolved_until="${{ github.event.inputs.until }}"
          resolved_mode="manual"
          resolved_count=""
          RESOLVED_SINCE=""
          RESOLVED_UNTIL=""
          RESOLVED_WINDOW_MODE=""
          RESOLVED_CLOSED_ROW_COUNT=""
          if [ -f artifacts/parity/resolved-window.env ]; then
            # shellcheck disable=SC1091
            . artifacts/parity/resolved-window.env
            resolved_since="${RESOLVED_SINCE}"
            resolved_until="${RESOLVED_UNTIL}"
            resolved_mode="${RESOLVED_WINDOW_MODE}"
            resolved_count="${RESOLVED_CLOSED_ROW_COUNT:-}"
          fi
          {
            echo "## Recorded Replay vs Dry-run Parity"
            echo ""
            echo "- Deployment: \`${{ github.event.inputs.deployment_id }}\`"
            echo "- Config: \`${{ github.event.inputs.config_path }}\`"
            echo "- Recording: \`${{ github.event.inputs.recording_path }}\`"
            echo "- Requested window: \`${{ github.event.inputs.since }} -> ${{ github.event.inputs.until }}\`"
            echo "- Resolved window: \`${resolved_since} -> ${resolved_until}\`"
            echo "- Window mode: \`${resolved_mode}\`"
            if [ -n "${resolved_count}" ]; then
              echo "- Auto-window closed rows: \`${resolved_count}\`"
            fi
            if [ -f artifacts/parity/parity-evaluation.json ]; then
              echo "- Artifact: \`recorded-replay-parity-${{ github.run_id }}\`"
              echo ""
              echo '```json'
              python3 -c 'import json; data=json.load(open("artifacts/parity/parity-evaluation.json")); runtime=data.get("runtime_evidence_comparison") or {}; orders=runtime.get("orders") or {}; fills=runtime.get("fills") or {}; print(json.dumps({"decision": data.get("decision"), "blocking_risk_flags": data.get("blocking_risk_flags"), "advisory_flags": data.get("advisory_flags"), "strict_parity_ready": runtime.get("strict_parity_ready"), "shared_orders": orders.get("shared_count"), "shared_fills": fills.get("shared_count")}, indent=2, sort_keys=True))'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recorded-replay-parity-${{ github.run_id }}
          path: artifacts/parity/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload replay and dry-run inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recorded-replay-inputs-${{ github.run_id }}
          path: |
            artifacts/replay/
            artifacts/dryrun/
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment parity evidence on issue
        if: ${{ always() && github.event.inputs.issue_number != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { applyResearchIssueLabels, labelsForDecision } = require("./.github/scripts/research-issue-labels.js");
            const issue_number = Number("${{ github.event.inputs.issue_number }}");
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            let decision = "missing parity artifact";
            let strictReady = false;
            let blocking = [];
            let advisory = [];
            let sharedOrders = null;
            let sharedFills = null;
            let resolvedWindow = {
              since: "${{ github.event.inputs.since }}",
              until: "${{ github.event.inputs.until }}",
              mode: "manual",
              closed_row_count: null
            };
            if (fs.existsSync("artifacts/parity/resolved-window.json")) {
              resolvedWindow = JSON.parse(fs.readFileSync("artifacts/parity/resolved-window.json", "utf8"));
            }
            if (fs.existsSync("artifacts/parity/parity-evaluation.json")) {
              const data = JSON.parse(fs.readFileSync("artifacts/parity/parity-evaluation.json", "utf8"));
              const runtime = data.runtime_evidence_comparison || {};
              decision = data.decision || decision;
              strictReady = Boolean(runtime.strict_parity_ready);
              blocking = data.blocking_risk_flags || data.risk_flags || [];
              advisory = data.advisory_flags || [];
              sharedOrders = runtime.orders?.shared_count ?? null;
              sharedFills = runtime.fills?.shared_count ?? null;
            }
            const body = [
              "Recorded replay/dry-run parity evidence:",
              "",
              `- Workflow: ${context.workflow}`,
              `- Run URL: ${runUrl}`,
              `- Deployment: \`${{ github.event.inputs.deployment_id }}\``,
              `- Config: \`${{ github.event.inputs.config_path }}\``,
              `- Recording: \`${{ github.event.inputs.recording_path }}\``,
              `- Requested window: \`${{ github.event.inputs.since }} -> ${{ github.event.inputs.until }}\``,
              `- Resolved window: \`${resolvedWindow.since} -> ${resolvedWindow.until}\``,
              `- Window mode: \`${resolvedWindow.mode || "manual"}\``,
              resolvedWindow.closed_row_count == null ? null : `- Auto-window closed rows: \`${resolvedWindow.closed_row_count}\``,
              `- Artifact: \`recorded-replay-parity-${process.env.GITHUB_RUN_ID}\``,
              `- Strict parity ready: \`${strictReady}\``,
              `- Shared orders/fills: \`${sharedOrders ?? "n/a"} / ${sharedFills ?? "n/a"}\``,
              `- Blocking flags: \`${blocking.join(", ") || "none"}\``,
              `- Advisory flags: \`${advisory.join(", ") || "none"}\``,
              `- Decision: ${decision}`
            ].filter(Boolean).join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
            const labels = [
              "evidence:parity",
              strictReady && blocking.length === 0 ? "parity:ready" : "parity:blocked",
              ...labelsForDecision(decision)
            ];
            if (decision === "missing parity artifact") {
              labels.push("evidence:missing-artifact");
            }
            await applyResearchIssueLabels({ github, context, core, issue_number, labels });
