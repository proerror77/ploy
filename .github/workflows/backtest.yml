name: Backtest pm_5m_directional

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: true
        default: "main"
      start_date:
        description: "Backtest start date (YYYY-MM-DD)"
        required: true
        default: "2026-03-28"
      end_date:
        description: "Backtest end date (YYYY-MM-DD)"
        required: true
        default: "2026-04-03"
      config:
        description: "Strategy config path (relative to repo root)"
        required: true
        default: "config/strategies/02-pm5d-threelayer.unified.toml"

concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PATH: /home/runner/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build:
    name: Build run_backtest binary
    runs-on: [self-hosted, ploy-ci-1]
    timeout-minutes: 45
    environment: ploy-ci-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-targets: "true"
          key: backtest-${{ hashFiles('crates/ploy-strategy-bundles/**', 'Cargo.lock') }}

      - name: Build run_backtest
        run: |
          . /home/runner/.cargo/env
          cargo build --release --locked \
            -p ploy-strategy-bundles \
            --example run_backtest

      - name: Upload run_backtest binary
        uses: actions/upload-artifact@v4
        with:
          name: run_backtest-${{ github.sha }}
          path: target/release/examples/run_backtest
          retention-days: 1

  backtest:
    name: Run backtest on ploy-ci-1
    runs-on: [self-hosted, ploy-ci-1]
    timeout-minutes: 30
    environment: ploy-ci-1
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Download run_backtest binary
        uses: actions/download-artifact@v4
        with:
          name: run_backtest-${{ github.sha }}
          path: target/release/examples

      - name: Make binary executable
        run: chmod +x target/release/examples/run_backtest

      - name: Run backtest
        env:
          CONFIG: ${{ github.event.inputs.config }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          ./target/release/examples/run_backtest \
            --config "${CONFIG}" \
            --db-url "postgresql://postgres:postgres@172.16.0.204:5432/ploy" \
            --start-date "${START_DATE}" \
            --end-date "${END_DATE}"
