name: Backtest pm_5m_directional

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: true
        default: "main"
      start_date:
        description: "Backtest start date (YYYY-MM-DD)"
        required: true
        default: "2026-03-28"
      end_date:
        description: "Backtest end date (YYYY-MM-DD)"
        required: true
        default: "2026-04-03"
      config:
        description: "Strategy config path (relative to repo root)"
        required: true
        default: "config/strategies/02-pm5d.unified.toml"

concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PLATFORM_TARGET: x86_64-unknown-linux-gnu

jobs:
  backtest:
    name: Run backtest on tango-1-1
    runs-on: [self-hosted, tango-1-1]
    timeout-minutes: 30
    environment: tango-1-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.PLATFORM_TARGET }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld

      - name: Build run_backtest
        run: |
          cargo build --release --locked \
            --target "${PLATFORM_TARGET}" \
            -p ploy-strategy-bundles \
            --example run_backtest
          strip "target/${PLATFORM_TARGET}/release/examples/run_backtest" || true

      - name: Upload binary to tango-1-1
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TANGO_1_1_HOST }}
          username: root
          key: ${{ secrets.TANGO_1_1_SSH_KEY }}
          source: target/${{ env.PLATFORM_TARGET }}/release/examples/run_backtest
          target: /root/ploy/bin/
          strip_components: 4

      - name: Upload config to tango-1-1
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TANGO_1_1_HOST }}
          username: root
          key: ${{ secrets.TANGO_1_1_SSH_KEY }}
          source: ${{ github.event.inputs.config }}
          target: /root/ploy/config/
          strip_components: 2

      - name: Resolve config filename
        id: config
        env:
          CONFIG_PATH: ${{ github.event.inputs.config }}
        run: echo "basename=$(basename "${CONFIG_PATH}")" >> "$GITHUB_OUTPUT"

      - name: Run backtest on tango-1-1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TANGO_1_1_HOST }}
          username: root
          key: ${{ secrets.TANGO_1_1_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            chmod +x /root/ploy/bin/run_backtest

            /root/ploy/bin/run_backtest \
              --config "/root/ploy/config/${{ steps.config.outputs.basename }}" \
              --db-url "postgresql://postgres:postgres@localhost:5432/ploy" \
              --start-date "${{ github.event.inputs.start_date }}" \
              --end-date "${{ github.event.inputs.end_date }}"
