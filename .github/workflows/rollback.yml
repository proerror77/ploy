name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Rollback mode"
        required: true
        type: choice
        options:
          - latest-backup
          - specific-tag
        default: latest-backup
      release_tag:
        description: "Required when mode=specific-tag (vX.Y.Z)"
        required: false
      reason:
        description: "Reason for rollback"
        required: true

concurrency:
  group: production-rollback
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_ROOT: ${{ vars.ALIYUN_PLOY_ROOT || '/root/ploy' }}

jobs:
  rollback:
    name: Execute Rollback
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate input
        run: |
          if [ "${{ github.event.inputs.mode }}" = "specific-tag" ] && [ -z "${{ github.event.inputs.release_tag }}" ]; then
            echo "release_tag is required when mode=specific-tag"
            exit 1
          fi

      - name: Roll back service on Aliyun ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_ECS_HOST }}
          username: root
          key: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_ROOT
          script: |
            set -euo pipefail
            MODE="${{ github.event.inputs.mode }}"
            RELEASE_TAG="${{ github.event.inputs.release_tag }}"
            DEPLOY_ROOT="${DEPLOY_ROOT:-/root/ploy}"

            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              SUDO="sudo"
            fi

            $SUDO systemctl stop ploy || true

            if [ "$MODE" = "specific-tag" ]; then
              target="${DEPLOY_ROOT}/releases/${RELEASE_TAG}/ploy"
              if [ ! -f "$target" ]; then
                echo "Release binary not found: $target"
                exit 1
              fi
              $SUDO cp "$target" "${DEPLOY_ROOT}/bin/ploy"
              echo "$RELEASE_TAG" | $SUDO tee "${DEPLOY_ROOT}/bin/.current_release" > /dev/null
            else
              latest_backup="$(ls -1t "${DEPLOY_ROOT}/bin/ploy.bak."* 2>/dev/null | head -1 || true)"
              if [ -n "$latest_backup" ]; then
                $SUDO cp "$latest_backup" "${DEPLOY_ROOT}/bin/ploy"
              elif [ -f "${DEPLOY_ROOT}/bin/ploy.bak" ]; then
                $SUDO cp "${DEPLOY_ROOT}/bin/ploy.bak" "${DEPLOY_ROOT}/bin/ploy"
              else
                echo "No backup binary found in ${DEPLOY_ROOT}/bin"
                exit 1
              fi
            fi

            $SUDO chmod +x "${DEPLOY_ROOT}/bin/ploy"
            $SUDO systemctl start ploy

            # Health check: 20 attempts, 2s delay (matches release-aliyun.yml)
            for i in $(seq 1 20); do
              if $SUDO systemctl is-active --quiet ploy; then
                echo "ploy.service is active after ${i} checks."
                exit 0
              fi
              sleep 2
            done

            echo "ploy.service failed to become active after 40s."
            $SUDO systemctl status ploy --no-pager -l || true
            $SUDO journalctl -u ploy -n 80 --no-pager -l || true
            exit 1

      - name: Rollback summary
        run: |
          echo "## Rollback Executed" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: ${{ github.event.inputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- Release tag: ${{ github.event.inputs.release_tag || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Reason: ${{ github.event.inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
