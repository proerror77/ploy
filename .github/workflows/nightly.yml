name: Nightly Deep Checks

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-deep-checks
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  deep-checks:
    name: Deep Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ploy
          POSTGRES_PASSWORD: ploy
          POSTGRES_DB: ploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-deep-checks

      - name: Workspace tests (default features)
        env:
          DATABASE_URL: postgres://ploy:ploy@localhost:5432/ploy_test
        run: cargo test --locked --workspace --all-targets

      - name: RL feature tests (main crate)
        env:
          DATABASE_URL: postgres://ploy:ploy@localhost:5432/ploy_test
        run: cargo test --locked --all-targets --features rl

      - name: Release build
        run: cargo build --release --locked --features rl

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: cargo audit

  open-followup-issue:
    name: Open Follow-up Issue
    needs: deep-checks
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Create or update nightly failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Nightly Deep Checks failed";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              "Nightly deep checks failed and need follow-up.",
              "",
              `- Workflow: ${context.workflow}`,
              `- Run: ${runUrl}`,
              `- Branch/Ref: ${context.ref}`,
              `- Commit: ${context.sha}`,
              "",
              "Please investigate and fix before next release."
            ].join("\n");

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`
            });

            if (search.data.items.length > 0) {
              const issueNumber = search.data.items[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
              core.info(`Updated existing issue #${issueNumber}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Created issue #${issue.data.number}`);
            }
