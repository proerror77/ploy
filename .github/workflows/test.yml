name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SQLX_CLI_VERSION: 0.8.6

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ploy
          POSTGRES_PASSWORD: ploy
          POSTGRES_DB: ploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit hygiene (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          range="${BASE_SHA}..HEAD"
          echo "Checking commit subjects in range: ${range}"
          git log --oneline "${range}"

          bad_commits="$(git log --format='%h %s' "${range}" | grep -E '^[0-9a-f]+ (WIP|wip|fixup!|squash!)' || true)"
          if [ -n "${bad_commits}" ]; then
            echo "Found non-atomic/WIP commit subjects:"
            echo "${bad_commits}"
            echo "Please squash or rewrite commit messages before merge."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev clang lld
          sudo apt-get install -y sccache || cargo install sccache --locked
          sudo apt-get install -y mold || true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-suite

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-test-
            ${{ runner.os }}-sccache-

      - name: Install SQLx CLI
        run: |
          cargo install sqlx-cli \
            --locked \
            --version "${SQLX_CLI_VERSION}" \
            --no-default-features \
            --features rustls,postgres

      - name: Dependency vulnerability audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: |
          # Temporary exception: sqlx 0.8.6 keeps an unused mysql driver chain in Cargo.lock,
          # which pulls the vulnerable `rsa` crate despite no mysql runtime in this repo.
          # RUSTSEC-2026-0049: rustls-webpki 0.103.8 has CRL matching issue, requires rustls update.
          cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0049

      - name: Prepare database schema for compile-time SQLx checks
        env:
          DATABASE_URL: postgres://ploy:ploy@localhost:5432/ploy_test
        run: sqlx migrate run

      - name: Build
        env:
          DATABASE_URL: postgres://ploy:ploy@localhost:5432/ploy_test
          RUSTC_WRAPPER: sccache
          SCCACHE_CACHE_SIZE: 10G
        run: |
          cargo build --locked \
            -p ploy-daemon-host \
            -p new-ployd \
            -p new-ploy-runner \
            -p ployctl \
            -p ploy-control-client \
            -p ploytui \
            -p ploy-connectivity \
            -p ploy-deployments \
            -p ploy-market-data \
            -p ploy-operator-contracts \
            -p ploy-platform \
            -p ploy-platform-runtime \
            -p ploy-research \
            -p ploy-runner-host \
            -p ploy-strategy-runtime \
            -p ploy-strategy-bundles \
            -p ploy-trading

      - name: Run tests
        env:
          DATABASE_URL: postgres://ploy:ploy@localhost:5432/ploy_test
          RUSTC_WRAPPER: sccache
          SCCACHE_CACHE_SIZE: 10G
        run: |
          cargo test --locked \
            -p ploy-daemon-host \
            -p new-ployd \
            -p new-ploy-runner \
            -p ployctl \
            -p ploy-control-client \
            -p ploytui \
            -p ploy-connectivity \
            -p ploy-deployments \
            -p ploy-market-data \
            -p ploy-operator-contracts \
            -p ploy-platform \
            -p ploy-platform-runtime \
            -p ploy-research \
            -p ploy-runner-host \
            -p ploy-strategy-runtime \
            -p ploy-strategy-bundles \
            -p ploy-trading
          cargo test --locked -p ploy --test platform_release_workflow
          cargo test --locked -p ploy --test platform_smoke
          cargo test --locked -p ploy --test workspace_runtime_retirement
          cargo test --locked -p ploy --test workflow_security ci_runs_dependency_vulnerability_audit -- --exact
          cargo test --locked -p ploy --test workflow_security checked_in_platform_service_enforces_guardrails -- --exact

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true

  open-followup-issue:
    name: Open Follow-up Issue
    needs: test
    runs-on: ubuntu-latest
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Create or update CI failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Main CI failed";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              "Automated CI detected a failure on `main`.",
              "",
              `- Workflow: ${context.workflow}`,
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              "",
              "Please investigate and fix."
            ].join("\n");

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`
            });

            if (search.data.items.length > 0) {
              const issueNumber = search.data.items[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
              core.info(`Updated existing issue #${issueNumber}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Created issue #${issue.data.number}`);
            }
