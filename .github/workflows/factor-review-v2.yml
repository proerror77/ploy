name: Factor Review V2

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref"
        required: true
        default: "main"
      start_date:
        description: "Review start date (YYYY-MM-DD)"
        required: true
        default: "2026-04-24"
      end_date:
        description: "Review end date (YYYY-MM-DD)"
        required: true
        default: "2026-04-24"
      symbols:
        description: "Comma-separated Binance symbols"
        required: true
        default: "BTCUSDT,ETHUSDT,SOLUSDT,DOGEUSDT,BNBUSDT,XRPUSDT"
      stake_usd:
        description: "Fixed notional per candidate"
        required: true
        default: "15"
      lob_sample_secs:
        description: "Binance LOB sample interval"
        required: false
        default: "30"
      observation_sample_secs:
        description: "Factor observation output interval"
        required: false
        default: "30"
      max_quote_age_secs:
        description: "Maximum PM quote age"
        required: false
        default: "30"
      snapshot_run_id:
        description: "Optional Research Snapshot workflow run id to consume"
        required: false
        default: ""
      options_json:
        description: "Advanced hosted options JSON: top_n, factor filters, issue_number, local snapshot registry"
        required: false
        default: '{"top_n":50,"min_observations":20,"top_quantile":0.2,"factor_name_filter":"","issue_number":"","snapshot_registry_dir":""}'

concurrency:
  group: factor-review-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  route-hosted-artifact:
    name: Route snapshot-backed factor review to GitHub-hosted runner
    if: ${{ github.event.inputs.snapshot_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout orchestration code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Dispatch hosted artifact workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_REF: ${{ github.event.inputs.git_ref }}
          OPTIONS_JSON: ${{ github.event.inputs.options_json }}
        run: |
          set -euo pipefail
          hosted_options="$(python3 - <<'PY'
          import json
          import os

          allowed = {
              "lob_sample_secs",
              "pm_book_sample_secs",
              "observation_sample_secs",
              "max_quote_age_secs",
              "top_n",
              "min_observations",
              "top_quantile",
              "factor_name_filter",
              "issue_number",
          }
          raw = os.environ.get("OPTIONS_JSON", "").strip()
          data = json.loads(raw) if raw else {}
          if not isinstance(data, dict):
              raise SystemExit("options_json must be a JSON object")
          filtered = {key: value for key, value in data.items() if key in allowed}
          print(json.dumps(filtered, separators=(",", ":"), sort_keys=True))
          PY
          )"
          gh workflow run factor-review-v2-hosted-artifact.yml \
            --ref "${GIT_REF}" \
            -f git_ref="${GIT_REF}" \
            -f snapshot_run_id="${{ github.event.inputs.snapshot_run_id }}" \
            -f start_date="${{ github.event.inputs.start_date }}" \
            -f end_date="${{ github.event.inputs.end_date }}" \
            -f symbols="${{ github.event.inputs.symbols }}" \
            -f stake_usd="${{ github.event.inputs.stake_usd }}" \
            -f options_json="${hosted_options}"

      - name: Write routing summary
        run: |
          {
            echo "## Factor Review V2"
            echo ""
            echo "Snapshot-backed requests are routed to \`factor-review-v2-hosted-artifact.yml\` on \`ubuntu-latest\`."
            echo ""
            echo "- Source snapshot run: \`${{ github.event.inputs.snapshot_run_id }}\`"
            echo "- Active path: hosted snapshot artifact"
          } >> "$GITHUB_STEP_SUMMARY"

  reject-missing-snapshot:
    name: Reject non-snapshot factor review
    if: ${{ github.event.inputs.snapshot_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Explain canonical research path
        run: |
          {
            echo "## Factor Review V2"
            echo ""
            echo "This workflow is now a snapshot-backed router only."
            echo "Run research-snapshot.yml first, then dispatch this workflow with snapshot_run_id so it routes to factor-review-v2-hosted-artifact.yml."
            echo "The former ploy-ci-1 direct-DB branch has been removed from the active research chain."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Factor Review V2 requires snapshot_run_id; direct DB research is no longer available from this workflow." >&2
          exit 2
